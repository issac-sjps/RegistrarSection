<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學校補助與獎學金申請備忘錄</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft JhengHei';
            background-color: #f4f7f6;
            color: #333;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 15px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }
        th {
            background-color: #34495e;
            color: white;
            font-weight: bold;
            white-space: nowrap;
        }
        /* 欄位寬度設定 */
        .col-idx { width: 5%; }
        .col-name { width: 35%; text-align: left; }
        .col-date { width: 15%; }
        .col-countdown { width: 15%; }
        .col-status { width: 15%; }

        input[type="text"].date-input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            width: 120px;
            text-align: center;
            font-size: 0.95em;
        }
        input[type="text"].date-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        input[type="text"].remark-input {
            width: 90%;
            padding: 4px;
            border: 1px dashed #aaa;
            border-radius: 3px;
            background-color: #fafafa;
            color: #555;
            font-size: 0.9em;
            margin-top: 5px;
        }
        input[type="text"].remark-input:focus {
            border-color: #e67e22;
            background-color: #fff;
            outline: none;
        }
        a { color: #2980b9; text-decoration: none; }
        a:hover { text-decoration: underline; color: #1a5276; }
        
        .status-incomplete { background-color: #ffebee; transition: 0.3s; }
        .status-complete { background-color: #e8f5e9; transition: 0.3s; }
        
        .badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9em;
            display: inline-block;
            min-width: 65px;
        }
        .badge-red { background-color: #ffcdd2; color: #c62828; }
        .badge-green { background-color: #c8e6c9; color: #2e7d32; }
        
        .clear-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .clear-btn:hover { background-color: #c0392b; }
        .remark-text { font-size: 0.85em; color: #666; margin-top: 5px; line-height: 1.4; }
    </style>
</head>
<body>

    <h1>📝 學校補助與獎學金申請備忘錄</h1>

    <table>
        <thead>
            <tr>
                <th class="col-idx">項次</th>
                <th class="col-name">申請項目</th>
                <th class="col-date">截止日期</th>
                <th class="col-countdown">倒數天數</th>
                <th class="col-date">完成日期</th>
                <th class="col-status">狀態</th>
            </tr>
        </thead>
        <tbody id="memo-body">
            </tbody>
    </table>

    <button class="clear-btn" onclick="clearAllData()">⚠️ 清除所有紀錄 (重新開始)</button>

    <script>
        // 更新：加上第7項的專屬備註與 Email 連結
        const tasks = [
            { name: "學產基金(低收申請)", defaultDeadline: "115/03/23 (一)" },
            { name: "書籍費申請(高雄市)", defaultDeadline: "115/03/16 (一)" },
            { name: "簿本費申請(高雄市)", defaultDeadline: "115/03/16 (一)" },
            { 
                name: "代收代辦費(學前教育署)", 
                defaultDeadline: "115/02/26 (四)", 
                editableRemark: true,
                defaultRemark: "國中表單：16211；國小表單：16210"
            },
            { name: "代收代辦費-差額(高雄市)", defaultDeadline: "" },
            { name: "<a href='https://scholarship.coia.gov.tw' target='_blank'>原住民獎學金(高雄市) 🔗</a>", defaultDeadline: "115/03/20 (五)" },
            { 
                name: "原住民獎學金(國教署)", 
                defaultDeadline: "115/03/02 (一)",
                fixedRemark: "寄送至鼓山高中圖書館email信箱：<br><a href='mailto:brary@kusjh.kh.edu.tw'>brary@kusjh.kh.edu.tw 📧</a>"
            },
            { 
                name: "原住民清寒助學金", 
                defaultDeadline: "115/03/29 (日)",
                fixedRemark: "轉學填寫於此<a href='https://forms.gle/UNCY1Q1nMZ8erGdy8' target='_blank'>Google表單🔗</a>，<br>放棄請領填寫於此<a href='https://forms.gle/ZSRYBggBzWYGbngx8' target='_blank'>Google表單🔗</a>"
            }
        ];

        const tbody = document.getElementById('memo-body');

        function initTable() {
            tbody.innerHTML = '';
            tasks.forEach((task, index) => {
                let savedDeadline = localStorage.getItem(`deadline-${index}`);
                if (savedDeadline === null) savedDeadline = task.defaultDeadline;
                
                const savedCompletion = localStorage.getItem(`completion-${index}`) || '';
                
                let savedRemark = '';
                if (task.editableRemark) {
                    savedRemark = localStorage.getItem(`remark-${index}`);
                    if (savedRemark === null) savedRemark = task.defaultRemark;
                }
                
                const isComplete = savedCompletion !== '';
                const rowClass = isComplete ? 'status-complete' : 'status-incomplete';
                const badgeClass = isComplete ? 'badge-green' : 'badge-red';
                const badgeText = isComplete ? '✔️ 已完成' : '❌ 未完成';

                let remarkHtml = '';
                if (task.editableRemark) {
                    remarkHtml = `<div class="remark-text">備註：<input type="text" class="remark-input" value="${savedRemark}" onchange="saveData('remark', ${index}, this.value)" placeholder="可在此自訂備註..."></div>`;
                } else if (task.fixedRemark) {
                    remarkHtml = `<div class="remark-text">備註：${task.fixedRemark}</div>`;
                }

                const tr = document.createElement('tr');
                tr.id = rowId = `row-${index}`;
                tr.className = rowClass;
                
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="col-name">
                        <span style="font-weight: bold; font-size: 1.1em;">${task.name}</span>
                        ${remarkHtml}
                    </td>
                    <td>
                        <input type="text" class="date-input" id="deadline-${index}" value="${savedDeadline}" placeholder="如 1150329" onchange="processDate(this, ${index}, 'deadline')">
                    </td>
                    <td id="countdown-${index}">
                        </td>
                    <td>
                        <input type="text" class="date-input" id="completion-${index}" value="${savedCompletion}" placeholder="如 1150329" onchange="processDate(this, ${index}, 'completion')">
                    </td>
                    <td>
                        <span id="badge-${index}" class="badge ${badgeClass}">${badgeText}</span>
                    </td>
                `;
                tbody.appendChild(tr);
                
                // 網頁載入時計算倒數天數
                updateCountdown(index, savedDeadline);
            });
        }

        // 處理日期輸入
        function processDate(inputElement, index, type) {
            let val = inputElement.value.trim();
            
            if (val === '') {
                saveData(type, index, '');
                if (type === 'completion') updateStatus(index, '');
                if (type === 'deadline') updateCountdown(index, '');
                return;
            }

            let digits = val.replace(/\D/g, '');
            if (digits.length >= 7) { 
                let y = parseInt(digits.substring(0, 3));
                let m = parseInt(digits.substring(3, 5));
                let d = parseInt(digits.substring(5, 7));
                
                let dateObj = new Date(y + 1911, m - 1, d);
                let days = ['日', '一', '二', '三', '四', '五', '六'];
                let dayStr = days[dateObj.getDay()];
                
                val = `${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')} (${dayStr})`;
                inputElement.value = val;
            }

            saveData(type, index, val);
            if (type === 'completion') updateStatus(index, val);
            if (type === 'deadline') updateCountdown(index, val); 
        }

        // 計算並更新倒數天數
        function updateCountdown(index, dateStr) {
            const cdCell = document.getElementById(`countdown-${index}`);
            if (!dateStr) {
                cdCell.innerHTML = '<span style="color: #999;">-</span>';
                return;
            }
            
            const digits = dateStr.replace(/\D/g, '');
            if (digits.length >= 7) {
                const y = parseInt(digits.substring(0, 3)) + 1911;
                const m = parseInt(digits.substring(3, 5)) - 1; 
                const d = parseInt(digits.substring(5, 7));
                
                const targetDate = new Date(y, m, d);
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                const diffTime = targetDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays > 0) {
                    cdCell.innerHTML = `<span style="color: #d35400; font-weight: bold;">剩餘 ${diffDays} 天</span>`;
                } else if (diffDays === 0) {
                    cdCell.innerHTML = `<span style="color: #e74c3c; font-weight: bold; background-color: #fdebd0; padding: 2px 5px; border-radius: 4px;">今天截止！</span>`;
                } else {
                    cdCell.innerHTML = `<span style="color: #7f8c8d; font-weight: bold;">逾期 ${Math.abs(diffDays)} 天</span>`;
                }
            } else {
                cdCell.innerHTML = '<span style="color: #999;">格式錯誤</span>';
            }
        }

        function updateStatus(index, value) {
            const row = document.getElementById(`row-${index}`);
            const badge = document.getElementById(`badge-${index}`);
            
            if (value !== '') {
                row.className = 'status-complete';
                badge.className = 'badge badge-green';
                badge.innerHTML = '✔️ 已完成';
            } else {
                row.className = 'status-incomplete';
                badge.className = 'badge badge-red';
                badge.innerHTML = '❌ 未完成';
            }
        }

        function saveData(type, index, value) {
            localStorage.setItem(`${type}-${index}`, value);
        }

        function clearAllData() {
            if (confirm("確定要清除所有的日期與自訂備註紀錄嗎？這會讓所有項目回到初始狀態。")) {
                localStorage.clear();
                initTable();
            }
        }

        window.onload = initTable;
    </script>
</body>
</html>
