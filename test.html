<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學評語產生器 - 風格混搭版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #f0f3f7; --accent: #ff7675; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; color: #2d3436; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* 區塊標題 */
        .section-title { font-size: 1.2rem; font-weight: bold; color: var(--primary); margin: 25px 0 15px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ""; width: 6px; height: 20px; background: var(--primary); border-radius: 3px; }

        /* 風格選擇器 */
        .style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; background: #f9f9ff; padding: 20px; border-radius: 12px; border: 2px dashed #dcdde1; }
        .style-btn { 
            padding: 10px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; text-align: center; 
            background: white; transition: 0.3s; font-size: 0.9rem;
        }
        .style-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* 標籤網格 */
        .tag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .tag-item { 
            display: flex; align-items: center; gap: 5px; padding: 8px 12px; 
            background: #fff; border: 1px solid #eee; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
        }
        .tag-item:hover { border-color: var(--primary); }
        .tag-item.active { background: #f0eeff; border-color: var(--primary); color: var(--primary); }

        /* 學生與結果 */
        .main-layout { display: grid; grid-template-columns: 200px 1fr; gap: 30px; margin-top: 20px; }
        .stu-list { border: 1px solid #eee; border-radius: 10px; height: 600px; overflow-y: auto; }
        .stu-card { padding: 12px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
        .stu-card.active { background: var(--primary); color: white; }

        .result-panel { position: sticky; bottom: 10px; background: #2d3436; color: #fff; padding: 25px; border-radius: 15px; margin-top: 30px; }
        textarea { width: 100%; height: 100px; background: transparent; border: none; color: #fff; font-size: 1.1rem; line-height: 1.6; resize: none; outline: none; }
        .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .btn-copy { background: var(--accent); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center; margin-top:0;">🎭 趣味評語大師 (Style Mixer)</h1>

    <div style="display: flex; gap: 20px; align-items: flex-end;">
        <div style="flex: 1;">
            <label>👤 學生姓名</label>
            <input type="text" id="stuName" style="width:100%; box-sizing:border-box; padding:10px; margin-top:5px;" placeholder="手動輸入或由左側選取" oninput="generate()">
        </div>
        <input type="file" id="excelIn" accept=".xlsx, .xls">
    </div>

    <div class="section-title">✨ 選擇評語風格 (最多選擇兩種)</div>
    <div class="style-grid" id="styleBox">
        </div>

    <div class="main-layout">
        <div class="stu-list" id="nameList">
            <div style="padding:20px; color:#999;">尚未匯入名單</div>
        </div>

        <div id="tagsArea">
            </div>
    </div>

    <div class="result-panel">
        <textarea id="output" readonly></textarea>
        <div class="footer">
            <div id="status">選擇風格與特質以開始...</div>
            <button class="btn-copy" onclick="copyText()">一鍵複製內容</button>
        </div>
    </div>
</div>

<script>
const tagsData = {
    "資質與態度": ["聰穎靈活", "理解力強", "領悟快速", "認真專注", "勤勉好學", "主動求知", "善於思考", "舉一反三", "觀察力佳", "表達清晰", "善於溝通", "勇於發表", "不夠認真", "欠缺專注", "怠忽學業", "理解較慢", "需多練習", "有待加強", "遲交作業"],
    "個性與品德": ["性格溫和", "溫順文靜", "誠實守規矩", "有禮貌", "開朗活潑", "樂觀負責", "盡職做事", "認真守分", "性格內向", "不善交際", "羞怯膽小", "不夠自律", "做事粗心"],
    "團體與人際": ["待人和善", "人緣良好", "善解人意", "樂於助人", "熱心服務", "具領導力", "友愛同學", "願意分享", "樂於合作", "不太合群", "較少互動", "不善合作", "較少參與"],
    "專長與才藝": ["語文能力強", "寫作表達佳", "數理能力佳", "邏輯思維強", "計算能力好", "表演才能優", "美術天分佳", "音樂感佳", "運動能力強", "體能活動好", "動作協調佳", "創意思維佳", "想像力豐富", "創意點子多"]
};

const styles = ["口語人性化", "鼓勵型", "幽默", "溫馨", "分析型", "詩意", "個性化", "目標導向", "故事型", "十六箴言"];
let selectedStyles = ["口語人性化"]; // 預設一種
let selectedTags = [];
let currentName = "";

// 風格轉換引擎 (簡易邏輯示範)
const styleEngine = {
    "口語人性化": (name, tags) => `${name}這學期表現不錯，${tags.join('，')}，加油。`,
    "十六箴言": (name, tags) => {
        const sliced = tags.slice(0, 4);
        while(sliced.length < 4) sliced.push("表現穩健");
        return sliced.map(t => t.length === 4 ? t : (t + "優異").substring(0,4)).join('，') + "。";
    },
    "幽默": (name, tags) => `發現一枚${tags.includes('聰穎靈活') ? '智慧星人' : '地球小公民'}${name}！這學期你的${tags[0] || '日常'}表現簡直是驚喜包。`,
    "詩意": (name, tags) => `如清風拂過林梢，${name}在本學期的時光裡，展現了${tags.join('與')}的姿態。`,
    "故事型": (name, tags) => `在這一學期的冒險地圖中，${name}化身為${tags[0]}的勇者，克服了${tags.includes('遲交作業') ? '拖延惡龍' : '重重困難'}。`,
    "分析型": (name, tags) => `【綜合評核】姓名：${name}。特質描述：${tags.join('、')}。發展建議：持續優化。`,
    "鼓勵型": (name, tags) => `${name}，老師一直深信你的潛力。這學期你展現了${tags.join('，')}，這份努力值得肯定！`,
    "溫馨": (name, tags) => `親愛的${name}，老師好喜歡你那份${tags[0]}的特質，在這個大家庭裡，你總是那抹最暖的陽光。`,
    "目標導向": (name, tags) => `${name}本期目標達成：${tags.join('/')}。下期展望：精益求精。`,
    "個性化": (name, tags) => `這就是獨一無二的${name}！帶著${tags.join('的')}印記，在校園裡閃閃發光。`
};

function init() {
    // 生成風格按鈕
    const sBox = document.getElementById('styleBox');
    styles.forEach(s => {
        const btn = document.createElement('div');
        btn.className = `style-btn ${selectedStyles.includes(s) ? 'active' : ''}`;
        btn.innerText = s;
        btn.onclick = () => toggleStyle(s, btn);
        sBox.appendChild(btn);
    });

    // 生成標籤
    const tArea = document.getElementById('tagsArea');
    for(let cat in tagsData) {
        const title = document.createElement('div');
        title.className = "section-title";
        title.innerText = cat;
        tArea.appendChild(title);

        const grid = document.createElement('div');
        grid.className = "tag-grid";
        tagsData[cat].forEach(tag => {
            const item = document.createElement('div');
            item.className = "tag-item";
            item.innerText = tag;
            item.onclick = () => toggleTag(tag, item);
            grid.appendChild(item);
        });
        tArea.appendChild(grid);
    }
}

function toggleStyle(s, el) {
    if (selectedStyles.includes(s)) {
        selectedStyles = selectedStyles.filter(i => i !== s);
    } else {
        if (selectedStyles.length >= 2) {
            alert("最多只能選擇兩種風格喔！");
            return;
        }
        selectedStyles.push(s);
    }
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    selectedStyles.forEach(st => {
        const btns = Array.from(document.querySelectorAll('.style-btn'));
        btns.find(b => b.innerText === st).classList.add('active');
    });
    generate();
}

function toggleTag(tag, el) {
    if (selectedTags.includes(tag)) {
        selectedTags = selectedTags.filter(i => i !== tag);
        el.classList.remove('active');
    } else {
        selectedTags.push(tag);
        el.classList.add('active');
    }
    generate();
}

function generate() {
    const name = document.getElementById('stuName').value || "該生";
    if (selectedTags.length === 0) {
        document.getElementById('output').value = "請勾選特質標籤...";
        return;
    }

    // 混合風格邏輯：如果是兩種，則拼接起來
    let finalTxt = "";
    selectedStyles.forEach((s, idx) => {
        const content = styleEngine[s](name, selectedTags);
        finalTxt += (idx === 0) ? content : " " + content;
    });

    document.getElementById('output').value = finalResultFormat(finalTxt);
}

function finalResultFormat(txt) {
    // 移除重複姓名與過多標點
    return txt.replace(/\s+/g, "").replace(/，+/g, "，");
}

// Excel 處理
document.getElementById('excelIn').addEventListener('change', function(e) {
    const reader = new FileReader();
    reader.onload = (event) => {
        const wb = XLSX.read(new Uint8Array(event.target.result), {type: 'array'});
        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        const names = data.map(r => r['姓名'] || Object.values(r)[0]);
        renderNames(names);
    };
    reader.readAsArrayBuffer(e.target.files[0]);
});

function renderNames(names) {
    const list = document.getElementById('nameList');
    list.innerHTML = "";
    names.forEach(n => {
        const d = document.createElement('div');
        d.className = 'stu-card';
        d.innerText = n;
        d.onclick = () => {
            document.querySelectorAll('.stu-card').forEach(c => c.classList.remove('active'));
            d.classList.add('active');
            document.getElementById('stuName').value = n;
            generate();
        };
        list.appendChild(d);
    });
}

function copyText() {
    const area = document.getElementById('output');
    area.select();
    document.execCommand('copy');
    alert('評語複製成功！');
}

init();
</script>
</body>
</html>
