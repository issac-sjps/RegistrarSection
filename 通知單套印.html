<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧通知單產生器 V6.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }

        @page {
            size: A4;
            margin: 0.5cm;
        }

        .page {
            width: 200mm;
            min-height: 286mm;
            margin: 5mm auto;
            background: white;
            display: grid;
            page-break-after: always;
            border: 1px solid #ddd;
        }

        .notice-item {
            border: 0.5px solid #000;
            box-sizing: border-box;
            padding: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-title {
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
            color: black;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .sig-table { width: 100%; border-collapse: collapse; margin-top: auto; }
        .sig-table td { border: 1px solid black; padding: 4px; height: 32px; font-size: 0.85rem; line-height: 1.2; }
        .bg-label { background-color: #fcfcfc; text-align: center; font-weight: bold; width: 60%; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; padding: 0; }
            .page { border: none; box-shadow: none; margin: 0; width: 200mm; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

<div class="no-print p-6 bg-white border-b shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-wrap gap-6 items-start">
            
            <div class="flex-1 min-w-[220px] space-y-3">
                <h3 class="font-bold text-blue-800 border-l-4 border-blue-800 pl-2">1. 檔案與版型</h3>
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="w-full text-xs border p-2 rounded">
                <select id="templateType" class="w-full p-2 border rounded font-bold bg-blue-50 save-data" onchange="switchTemplate()">
                    <option value="award">版型 B：教務處領獎學金</option>
                    <option value="signature">版型 A：教務處通知</option>
                </select>
            </div>

            <div class="flex-1 min-w-[200px] space-y-3">
                <h3 class="font-bold text-purple-800 border-l-4 border-purple-800 pl-2">2. 排版設定</h3>
                <div class="flex items-center gap-2">
                    <input type="number" id="gridCols" value="2" class="w-14 p-2 border rounded text-center save-data">
                    <span>x</span>
                    <input type="number" id="gridRows" value="4" class="w-14 p-2 border rounded text-center save-data">
                    <span class="text-xs text-gray-400">0.5cm 邊距</span>
                </div>
                <div class="text-xs">
                    字體大小: <input type="range" id="fontSizeBase" min="10" max="26" value="14" class="w-full mt-2 save-data">
                </div>
            </div>

            <div class="flex-[2] min-w-[300px] space-y-2">
                <h3 class="font-bold text-orange-800 border-l-4 border-orange-800 pl-2">3. 內容編輯區</h3>
                <input id="customTitle" type="text" class="w-full border p-2 rounded font-bold save-data">
                <textarea id="customContent" class="w-full border p-2 h-28 text-sm save-data"></textarea>
            </div>

            <div class="flex flex-col gap-2 pt-8">
                <button onclick="processData()" class="bg-emerald-600 text-white py-2 px-6 rounded-md font-bold hover:bg-emerald-700 transition-all">🔄 產生預覽</button>
                <button onclick="window.print()" class="bg-blue-600 text-white py-2 px-6 rounded-md font-bold hover:bg-blue-700 shadow-md">🖨️ 開始列印</button>
                <span id="saveStatus" class="text-center text-[10px] text-gray-400">已啟用自動存檔</span>
            </div>
        </div>
    </div>
</div>

<div id="printArea" class="py-4">
    <div class="text-center py-40 text-gray-400 no-print italic">上傳 Excel 後點擊產生預覽...</div>
</div>

<script>
    let excelData = [];
    const STORAGE_KEY = 'notice_maker_v6_settings';

    // 定義兩套預設文字
    const defaultTexts = {
        award: {
            title: "教務處領獎學金",
            content: "時間：於明天9/17(三)第二節大下課。\n地點：教務處註冊組\n獎項：\n攜帶物品：聯絡簿、本通知單(應已貼於聯絡簿上)\n注意事項：\n1. 需有家長簽名才可以領獎學金。\n2. 請學生當場確認金額無誤後彌封訂於聯絡簿上帶回。\n3. 請家長當天確認學生是否有正確拿回獎學金給家長。學生簽領日期：__________"
        },
        signature: {
            title: "教務處通知",
            content: "簽名時間：收到通知單後的下課或放學時間。\n說明：教務處有相關申請資料需要學生本人簽名，請學生拿本通知單到教務處簽名。"
        }
    };

    function saveToLocal() {
        const settings = {
            templateType: document.getElementById('templateType').value,
            gridCols: document.getElementById('gridCols').value,
            gridRows: document.getElementById('gridRows').value,
            fontSizeBase: document.getElementById('fontSizeBase').value,
            customTitle: document.getElementById('customTitle').value,
            customContent: document.getElementById('customContent').value
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        document.getElementById('saveStatus').innerText = '自動儲存於 ' + new Date().toLocaleTimeString();
    }

    function loadFromLocal() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const s = JSON.parse(saved);
            document.getElementById('templateType').value = s.templateType || 'award';
            document.getElementById('gridCols').value = s.gridCols || 2;
            document.getElementById('gridRows').value = s.gridRows || 4;
            document.getElementById('fontSizeBase').value = s.fontSizeBase || 14;
            document.getElementById('customTitle').value = s.customTitle;
            document.getElementById('customContent').value = s.customContent;
        } else {
            switchTemplate(); // 無存檔時帶入初始預設
        }
    }

    // 切換版型時自動帶入預設文字
    function switchTemplate() {
        const type = document.getElementById('templateType').value;
        document.getElementById('customTitle').value = defaultTexts[type].title;
        document.getElementById('customContent').value = defaultTexts[type].content;
        saveToLocal();
    }

    document.querySelectorAll('.save-data').forEach(el => {
        el.addEventListener('input', saveToLocal);
    });

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            excelData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            alert("✅ Excel 讀取成功：共 " + excelData.length + " 位學生");
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function parseClass(grade, cls) {
        let g = grade?.toString() || "";
        let c = cls?.toString() || "";
        if (c.length >= 3 && c.startsWith(g)) return parseInt(c.substring(g.length));
        return c;
    }

    function processData() {
        if (excelData.length === 0) return alert("請先上傳 Excel 檔案");
        
        const type = document.getElementById('templateType').value;
        const title = document.getElementById('customTitle').value;
        const content = document.getElementById('customContent').value.replace(/\n/g, '<br>');
        const cols = parseInt(document.getElementById('gridCols').value);
        const rows = parseInt(document.getElementById('gridRows').value);
        const fSize = document.getElementById('fontSizeBase').value;
        const itemsPerPage = cols * rows;
        
        let html = '';
        for (let i = 0; i < excelData.length; i += itemsPerPage) {
            html += `<div class="page" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, 1fr); font-size: ${fSize}px;">`;
            
            const pageItems = excelData.slice(i, i + itemsPerPage);
            pageItems.forEach(student => {
                const g = student['年級'] || '';
                const rawC = student['班級'] || '';
                const s = student['座號'] || '';
                const name = student['姓名'] || '';
                const c = parseClass(g, rawC);
                const classCode = `${g}${c.toString().padStart(2,'0')}-${s}`;

                if (type === 'award') {
                    html += `
                    <div class="notice-item">
                        <div class="main-title" style="font-size: 1.4em;">${title}</div>
                        <div class="font-bold border-b border-gray-400 pb-1 mb-1 text-[0.9em]">
                            領獎人：${classCode} ${name}
                            <span class="float-right font-normal text-gray-500 text-[0.7em]">【請協助貼於聯絡簿上】</span>
                        </div>
                        <div class="flex-grow py-1 leading-tight text-[0.85em]">
                            ${content}
                        </div>
                        <table class="sig-table">
                            <tr><td class="bg-label">事前家長簽章</td><td></td></tr>
                            <tr><td class="bg-label">學生確認錢無誤後簽章</td><td></td></tr>
                            <tr><td class="bg-label">教務處發放完畢簽章</td><td></td></tr>
                        </table>
                    </div>`;
                } else {
                    html += `
                    <div class="notice-item">
                        <div class="main-title">${title}</div>
                        <div class="border-y border-black py-2 my-2 font-bold text-center text-[1.2em]">
                            ${g} 年 ${c} 班  ${s} 號  ${name}
                        </div>
                        <div class="flex-grow pt-2 leading-relaxed text-[1em]">
                            ${content}
                        </div>
                    </div>`;
                }
            });

            for(let j=0; j < (itemsPerPage - pageItems.length); j++) {
                html += `<div class="notice-item border-dashed border-gray-100"></div>`;
            }
            html += `</div>`;
        }
        document.getElementById('printArea').innerHTML = html;
        saveToLocal();
    }

    loadFromLocal();
</script>

</body>
</html>
