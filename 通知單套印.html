<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧通知單產生器 V8 - 終極對齊版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; }

        @page { size: A4; margin: 0; }
        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 5mm; /* 回歸你要求的 0.5cm 邊界 */
            margin: 10px auto;
            background: white;
            position: relative;
            page-break-after: always;
            box-sizing: border-box;
            display: block;
        }

        .notice-item {
            display: inline-block;
            vertical-align: top;
            border: 1px solid #000;
            box-sizing: border-box;
            padding: 10px;
            overflow: hidden;
            background: white;
            position: relative;
        }

        .main-title { font-size: 1.5rem; font-weight: 900; text-align: center; margin-bottom: 5px; }
        .sig-table { width: 100%; border-collapse: collapse; margin-top: auto; }
        .sig-table td { border: 1px solid black; padding: 4px; height: 32px; font-size: 0.8rem; }
        .bg-label { background-color: #f9fafb; text-align: center; font-weight: bold; width: 55%; }

        /* 彈窗樣式 */
        #dataModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 900px; max-height: 85vh; overflow-y: auto; padding: 25px; border-radius: 12px; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; }
            .page { margin: 0; border: none; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="no-print p-6 bg-white border-b-2 border-emerald-500 sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-wrap gap-4 items-start">
        
        <div class="w-64 space-y-2">
            <h3 class="font-bold text-blue-800 border-l-4 border-blue-500 pl-2">1. 檔案與核對</h3>
            <input type="file" id="excelFile" accept=".xlsx, .xls" class="w-full text-xs border p-1 rounded">
            <button onclick="toggleModal(true)" id="viewDataBtn" class="hidden w-full bg-slate-600 text-white py-1 rounded text-xs hover:bg-slate-700">🔍 查看上傳總表</button>
            <select id="templateType" class="w-full p-2 border rounded font-bold bg-blue-50 save-data" onchange="switchTemplate()">
                <option value="award">教務處領獎學金 (含表格)</option>
                <option value="signature">教務處通知單 (純文字)</option>
            </select>
        </div>

        <div class="w-64 space-y-2">
            <h3 class="font-bold text-purple-800 border-l-4 border-purple-500 pl-2">2. 格子微調 (mm)</h3>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <label>高度: <input type="number" id="boxHeight" value="68" class="w-full border rounded p-1 save-data" oninput="processData()"></label>
                <label>寬度%: <input type="number" id="boxWidth" value="49" class="w-full border rounded p-1 save-data" oninput="processData()"></label>
                <label>上下距: <input type="number" id="boxGap" value="2" class="w-full border rounded p-1 save-data" oninput="processData()"></label>
                <label>字體: <input type="number" id="fontSizeBase" value="14" class="w-full border rounded p-1 save-data" oninput="processData()"></label>
            </div>
        </div>

        <div class="flex-grow space-y-2">
            <h3 class="font-bold text-orange-800 border-l-4 border-orange-500 pl-2">3. 內容編輯</h3>
            <input id="customTitle" type="text" class="w-full border p-1 rounded font-bold text-sm save-data">
            <textarea id="customContent" class="w-full border p-1 h-16 text-xs save-data"></textarea>
        </div>

        <div class="flex flex-col gap-2 pt-6">
            <button onclick="processData()" class="bg-emerald-600 text-white py-2 px-6 rounded font-bold hover:bg-emerald-700 shadow-md">🔄 預覽刷新</button>
            <button onclick="window.print()" class="bg-blue-600 text-white py-2 px-6 rounded font-bold hover:bg-blue-700 shadow-md">🖨️ 開始列印</button>
            <span id="saveStatus" class="text-[10px] text-gray-400 text-center">已自動儲存</span>
        </div>
    </div>
</div>

<div id="dataModal" onclick="toggleModal(false)">
    <div class="modal-content shadow-2xl" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-xl font-bold text-blue-800">📊 已上傳資料核對總表</h2>
            <button onclick="toggleModal(false)" class="text-3xl text-gray-400 hover:text-red-500">&times;</button>
        </div>
        <table class="w-full text-sm border-collapse">
            <thead class="bg-gray-100 sticky top-0">
                <tr><th class="border p-2">流水號</th><th class="border p-2">年級</th><th class="border p-2">原班級</th><th class="border p-2">轉換後</th><th class="border p-2">座號</th><th class="border p-2">姓名</th></tr>
            </thead>
            <tbody id="modalTableBody"></tbody>
        </table>
    </div>
</div>

<div id="printArea" class="py-4"></div>

<script>
    let excelData = [];
    const STORAGE_KEY = 'notice_maker_v8_final';

    const defaultTexts = {
        award: {
            title: "教務處領獎學金",
            content: "時間：於明天9/17(三)第二節大下課。\n地點：教務處註冊組\n獎項：\n攜帶物品：聯絡簿、本通知單(應已貼於聯絡簿上)\n注意事項：\n1. 需有家長簽名才可以領獎學金。\n2. 請學生當場確認金額無誤後彌封訂於聯絡簿上帶回。\n3. 請家長當天確認學生是否有正確拿回獎學金給家長。學生簽領日期：__________"
        },
        signature: {
            title: "教務處通知單",
            content: "簽名時間：收到通知單後的下課或放學時間。\n說明：教務處有相關申請資料需要學生本人簽名，請學生拿本通知單到教務處簽名。"
        }
    };

    // --- 本地儲存邏輯 ---
    function saveToLocal() {
        const settings = {
            templateType: document.getElementById('templateType').value,
            boxHeight: document.getElementById('boxHeight').value,
            boxWidth: document.getElementById('boxWidth').value,
            boxGap: document.getElementById('boxGap').value,
            fontSizeBase: document.getElementById('fontSizeBase').value,
            customTitle: document.getElementById('customTitle').value,
            customContent: document.getElementById('customContent').value
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        document.getElementById('saveStatus').innerText = '儲存於 ' + new Date().toLocaleTimeString();
    }

    function loadFromLocal() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const s = JSON.parse(saved);
            Object.keys(s).forEach(key => {
                const el = document.getElementById(key);
                if (el) el.value = s[key];
            });
        } else {
            switchTemplate();
        }
    }

    // --- 彈窗核對邏輯 ---
    function toggleModal(show) {
        document.getElementById('dataModal').style.display = show ? 'flex' : 'none';
        if (show) fillModalTable();
    }

    function fillModalTable() {
        const tbody = document.getElementById('modalTableBody');
        tbody.innerHTML = excelData.map((row, i) => {
            const g = row['年級'] || '-';
            const parsedC = parseClass(g, row['班級'] || '-');
            return `<tr class="border-b hover:bg-blue-50">
                <td class="p-2 text-center text-gray-400">${i+1}</td>
                <td class="p-2 text-center">${g}</td>
                <td class="p-2 text-center text-gray-400">${row['班級'] || '-'}</td>
                <td class="p-2 text-center text-blue-700 font-bold">${parsedC}</td>
                <td class="p-2 text-center">${row['座號'] || '-'}</td>
                <td class="p-2 text-center font-bold">${row['姓名'] || '-'}</td>
            </tr>`;
        }).join('');
    }

    // --- 模板切換 ---
    function switchTemplate() {
        const type = document.getElementById('templateType').value;
        document.getElementById('customTitle').value = defaultTexts[type].title;
        document.getElementById('customContent').value = defaultTexts[type].content;
        document.getElementById('boxHeight').value = (type === 'award') ? 68 : 45;
        processData();
        saveToLocal();
    }

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            excelData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            document.getElementById('viewDataBtn').classList.remove('hidden');
            alert("✅ 讀取完成！共 " + excelData.length + " 位學生");
            processData();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function parseClass(grade, cls) {
        let g = grade?.toString() || "";
        let c = cls?.toString() || "";
        if (c.length >= 3 && c.startsWith(g)) return parseInt(c.substring(g.length));
        return c;
    }

    function processData() {
        if (excelData.length === 0) return;
        saveToLocal();
        
        const type = document.getElementById('templateType').value;
        const title = document.getElementById('customTitle').value;
        const content = document.getElementById('customContent').value.replace(/\n/g, '<br>');
        const boxH = document.getElementById('boxHeight').value;
        const boxW = document.getElementById('boxWidth').value;
        const boxGap = document.getElementById('boxGap').value;
        const fSize = document.getElementById('fontSizeBase').value;
        
        const itemsPerPage = Math.floor(280 / (parseFloat(boxH) + parseFloat(boxGap))) * 2;
        
        let html = '';
        for (let i = 0; i < excelData.length; i += itemsPerPage) {
            html += `<div class="page" style="font-size: ${fSize}px;">`;
            const pageItems = excelData.slice(i, i + itemsPerPage);
            
            pageItems.forEach((student, index) => {
                const g = student['年級'] || '';
                const rawC = student['班級'] || '';
                const s = student['座號'] || '';
                const name = student['姓名'] || '';
                const c = parseClass(g, rawC);
                const classCode = `${g}${c.toString().padStart(2,'0')}-${s}`;

                const itemStyle = `height: ${boxH}mm; width: ${boxW}%; margin-bottom: ${boxGap}mm; margin-right: ${index % 2 === 0 ? '1%' : '0'};`;

                if (type === 'award') {
                    html += `<div class="notice-item" style="${itemStyle}">
                        <div class="main-title" style="font-size: 1.4em;">${title}</div>
                        <div class="font-bold border-b border-black pb-1 mb-1 text-[0.85em]">
                            領獎人：${classCode} ${name} <span class="float-right font-normal text-gray-500 text-[0.6em]">【貼於聯絡簿】</span>
                        </div>
                        <div class="flex-grow py-1 leading-tight text-[0.8em]">${content}</div>
                        <table class="sig-table">
                            <tr><td class="bg-label">事前家長簽章</td><td></td></tr>
                            <tr><td class="bg-label">學生確認錢無誤後簽章</td><td></td></tr>
                            <tr><td class="bg-label">教務處發放完畢簽章</td><td></td></tr>
                        </table>
                    </div>`;
                } else {
                    html += `<div class="notice-item" style="${itemStyle}">
                        <div class="main-title" style="font-size: 1.6em;">${title}</div>
                        <div class="border-y border-black py-2 my-1 font-bold text-center text-[1.1em]">${g} 年 ${c} 班 ${s} 號 ${name}</div>
                        <div class="pt-1 leading-relaxed text-[1em]">${content}</div>
                    </div>`;
                }
            });
            html += `</div>`;
        }
        document.getElementById('printArea').innerHTML = html;
    }

    document.querySelectorAll('.save-data').forEach(el => el.addEventListener('input', saveToLocal));
    loadFromLocal();
</script>

</body>
</html>
