<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧通知單產生器 V6.3 - 分頁校正版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f1f5f9; }

        /* A4 強制定義 */
        @page {
            size: A4;
            margin: 0; /* 邊距交給 .page 處理更精準 */
        }

        .page {
            width: 210mm;
            height: 296.5mm; /* 稍微留 0.5mm 預防印表機誤差 */
            padding: 10mm; /* 設定列印邊距 */
            margin: 10px auto;
            background: white;
            display: grid;
            gap: 0; /* 格子之間不留空隙，由 padding 處理內部 */
            page-break-after: always;
            box-sizing: border-box;
            overflow: hidden; /* 強制不允許內容撐大頁面 */
        }

        .notice-item {
            border: 0.5px solid #000;
            box-sizing: border-box;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 內容過長時在內部裁切，不影響下一格 */
            break-inside: avoid; /* 防止在格子內部斷頁 */
        }

        /* 標題樣式 */
        .main-title {
            font-size: 1.6em;
            font-weight: 900;
            text-align: center;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        /* 表格固定高度，避免擠壓 */
        .sig-table { width: 100%; border-collapse: collapse; margin-top: auto; }
        .sig-table td { border: 1px solid black; padding: 4px; height: 30px; font-size: 0.85rem; }
        .bg-label { background-color: #f9f9f9; text-align: center; font-weight: bold; width: 55%; }

        /* 資料總表彈窗 */
        #dataModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 900px; max-height: 85vh; overflow-y: auto; padding: 25px; border-radius: 12px; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; padding: 0; }
            .page { margin: 0; border: none; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="no-print p-6 bg-white border-b shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-wrap gap-6 items-end">
        
        <div class="space-y-2">
            <h3 class="font-bold text-blue-800">1. 上傳與核對</h3>
            <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm border p-1 rounded">
            <button onclick="toggleModal(true)" id="viewDataBtn" class="hidden w-full bg-slate-600 text-white py-1 rounded text-xs hover:bg-slate-700">🔍 核對上傳資料清單</button>
        </div>

        <div class="space-y-2">
            <h3 class="font-bold text-purple-800">2. 版面設定 (欄 x 列)</h3>
            <div class="flex items-center gap-2">
                <select id="templateType" class="p-2 border rounded font-bold bg-blue-50 save-data" onchange="switchTemplate()">
                    <option value="award">教務處領獎學金</option>
                    <option value="signature">教務處通知單</option>
                </select>
                <input type="number" id="gridCols" value="2" class="w-12 p-2 border rounded text-center save-data" title="每行幾份">
                <span class="font-bold">×</span>
                <input type="number" id="gridRows" value="4" class="w-12 p-2 border rounded text-center save-data" title="每頁幾層">
            </div>
        </div>

        <div class="flex-grow space-y-2">
            <h3 class="font-bold text-orange-800">3. 編輯文字內容</h3>
            <input id="customTitle" type="text" class="w-full border px-2 py-1 rounded font-bold save-data text-sm">
            <textarea id="customContent" class="w-full border px-2 py-1 h-16 text-xs save-data"></textarea>
        </div>

        <div class="space-y-2">
            <div class="text-[10px] text-gray-500 mb-1">字體大小: <input type="range" id="fontSizeBase" min="10" max="24" value="14" class="save-data align-middle"></div>
            <button onclick="processData()" class="w-full bg-emerald-600 text-white py-2 px-4 rounded font-bold hover:bg-emerald-700">🔄 產生預覽</button>
            <button onclick="window.print()" class="w-full bg-blue-600 text-white py-2 px-4 rounded font-bold hover:bg-blue-700">🖨️ 直接列印</button>
        </div>
    </div>
</div>

<div id="dataModal" onclick="toggleModal(false)">
    <div class="modal-content shadow-2xl" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-xl font-bold text-blue-800">📊 上傳資料清單核對</h2>
            <button onclick="toggleModal(false)" class="text-3xl text-gray-400 hover:text-red-500">&times;</button>
        </div>
        <table class="w-full text-sm border-collapse">
            <thead class="bg-gray-100 sticky top-0">
                <tr><th class="border p-2">流水號</th><th class="border p-2">年級</th><th class="border p-2">原班級</th><th class="border p-2">轉換後班級</th><th class="border p-2">座號</th><th class="border p-2">姓名</th></tr>
            </thead>
            <tbody id="modalTableBody"></tbody>
        </table>
    </div>
</div>

<div id="printArea" class="py-4"></div>

<script>
    let excelData = [];
    const STORAGE_KEY = 'notice_maker_v6_3_settings';

    const defaultTexts = {
        award: {
            title: "教務處領獎學金",
            content: "時間：於明天9/17(三)第二節大下課。\n地點：教務處註冊組\n獎項：\n攜帶物品：聯絡簿、本通知單(應已貼於聯絡簿上)\n注意事項：\n1. 需有家長簽名才可以領獎學金。\n2. 請學生當場確認金額無誤後彌封訂於聯絡簿上帶回。\n3. 請家長當天確認學生是否有正確拿回獎學金給家長。學生簽領日期：__________"
        },
        signature: {
            title: "教務處通知單",
            content: "簽名時間：收到通知單後的下課或放學時間。\n說明：教務處有相關申請資料需要學生本人簽名，請學生拿本通知單到教務處簽名。"
        }
    };

    function saveToLocal() {
        const settings = {
            templateType: document.getElementById('templateType').value,
            gridCols: document.getElementById('gridCols').value,
            gridRows: document.getElementById('gridRows').value,
            fontSizeBase: document.getElementById('fontSizeBase').value,
            customTitle: document.getElementById('customTitle').value,
            customContent: document.getElementById('customContent').value
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    }

    function loadFromLocal() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const s = JSON.parse(saved);
            document.getElementById('templateType').value = s.templateType || 'award';
            document.getElementById('gridCols').value = s.gridCols || 2;
            document.getElementById('gridRows').value = s.gridRows || 4;
            document.getElementById('fontSizeBase').value = s.fontSizeBase || 14;
            document.getElementById('customTitle').value = s.customTitle;
            document.getElementById('customContent').value = s.customContent;
        } else {
            switchTemplate();
        }
    }

    function switchTemplate() {
        const type = document.getElementById('templateType').value;
        document.getElementById('customTitle').value = defaultTexts[type].title;
        document.getElementById('customContent').value = defaultTexts[type].content;
        saveToLocal();
    }

    function toggleModal(show) {
        document.getElementById('dataModal').style.display = show ? 'flex' : 'none';
        if (show) fillModalTable();
    }

    function fillModalTable() {
        const tbody = document.getElementById('modalTableBody');
        tbody.innerHTML = excelData.map((row, i) => {
            const g = row['年級'] || '-';
            const parsedC = parseClass(g, row['班級'] || '-');
            return `<tr class="border-b hover:bg-blue-50">
                <td class="p-2 text-center text-gray-400">${i+1}</td>
                <td class="p-2 text-center font-bold">${g}</td>
                <td class="p-2 text-center text-gray-400">${row['班級'] || '-'}</td>
                <td class="p-2 text-center text-blue-700 font-bold">${parsedC}</td>
                <td class="p-2 text-center">${row['座號'] || '-'}</td>
                <td class="p-2 text-center font-bold">${row['姓名'] || '-'}</td>
            </tr>`;
        }).join('');
    }

    document.querySelectorAll('.save-data').forEach(el => el.addEventListener('input', saveToLocal));

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            excelData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            document.getElementById('viewDataBtn').classList.remove('hidden');
            alert("✅ 檔案讀取成功！共 " + excelData.length + " 筆資料。");
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function parseClass(grade, cls) {
        let g = grade?.toString() || "";
        let c = cls?.toString() || "";
        if (c.length >= 3 && c.startsWith(g)) return parseInt(c.substring(g.length));
        return c;
    }

    function processData() {
        if (excelData.length === 0) return alert("請先上傳 Excel 檔案");
        
        const type = document.getElementById('templateType').value;
        const title = document.getElementById('customTitle').value;
        const content = document.getElementById('customContent').value.replace(/\n/g, '<br>');
        const cols = parseInt(document.getElementById('gridCols').value);
        const rows = parseInt(document.getElementById('gridRows').value);
        const fSize = document.getElementById('fontSizeBase').value;
        const itemsPerPage = cols * rows;
        
        let html = '';
        for (let i = 0; i < excelData.length; i += itemsPerPage) {
            // 這裡使用了 grid-template-rows: repeat(rows, 1fr) 來強制平均分配高度
            html += `<div class="page" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, 1fr); font-size: ${fSize}px;">`;
            const pageItems = excelData.slice(i, i + itemsPerPage);
            pageItems.forEach(student => {
                const g = student['年級'] || '';
                const rawC = student['班級'] || '';
                const s = student['座號'] || '';
                const name = student['姓名'] || '';
                const c = parseClass(g, rawC);
                const classCode = `${g}${c.toString().padStart(2,'0')}-${s}`;

                if (type === 'award') {
                    html += `
                    <div class="notice-item">
                        <div class="main-title">${title}</div>
                        <div class="font-bold border-b border-black pb-1 mb-1 text-[0.9em]">
                            領獎人：${classCode} ${name}
                            <span class="float-right font-normal text-gray-500 text-[0.7em]">【貼於聯絡簿】</span>
                        </div>
                        <div class="flex-grow py-1 leading-snug text-[0.85em]">${content}</div>
                        <table class="sig-table">
                            <tr><td class="bg-label">事前家長簽章</td><td></td></tr>
                            <tr><td class="bg-label">學生確認錢無誤後簽章</td><td></td></tr>
                            <tr><td class="bg-label">教務處發放完畢簽章</td><td></td></tr>
                        </table>
                    </div>`;
                } else {
                    html += `
                    <div class="notice-item">
                        <div class="main-title">${title}</div>
                        <div class="border-y border-black py-2 my-2 font-bold text-center text-[1.2em]">
                            ${g} 年 ${c} 班  ${s} 號  ${name}
                        </div>
                        <div class="flex-grow pt-2 leading-relaxed text-[1.05em]">${content}</div>
                    </div>`;
                }
            });
            for(let j=0; j < (itemsPerPage - pageItems.length); j++) {
                html += `<div class="notice-item border-dashed border-gray-100"></div>`;
            }
            html += `</div>`;
        }
        document.getElementById('printArea').innerHTML = html;
        saveToLocal();
    }

    loadFromLocal();
</script>

</body>
</html>
