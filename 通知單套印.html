<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧通知單產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-after: always; }
            body { background: white; }
            .preview-card { border: 1px solid #ccc; margin-bottom: 20px; box-shadow: none !important; }
        }
        .notice-card { min-height: 148mm; width: 100%; } /* A5 尺寸感 */
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="flex flex-col md:flex-row no-print">
    <div class="w-full md:w-1/3 bg-white p-6 shadow-lg h-screen overflow-y-auto">
        <h1 class="text-2xl font-bold mb-6 text-blue-600">通知單製作系統</h1>
        
        <div class="mb-4">
            <label class="block font-bold mb-2">1. 選擇格式</label>
            <select id="templateSelect" class="w-full border p-2 rounded" onchange="renderNotices()">
                <option value="minimal">簡約黑白</option>
                <option value="formal">正式公文風</option>
                <option value="playful">活力可愛</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="block font-bold mb-2">2. 自訂文字內容</label>
            <input id="noticeTitle" type="text" value="學期末家長通知單" class="w-full border p-2 rounded mb-2" placeholder="標題" oninput="renderNotices()">
            <textarea id="noticeContent" class="w-full border p-2 rounded h-32" oninput="renderNotices()" placeholder="請輸入通知單內文...">親愛的家長您好：

感謝您本學期的配合，以下是貴子弟在校的相關資訊。請確認後簽章並繳回。

祝 順心</textarea>
        </div>

        <div class="mb-4">
            <label class="block font-bold mb-2">3. 學生資料 (格式: 年級 班級 座號 姓名)</label>
            <p class="text-xs text-gray-500 mb-2">每行一位同學，空格隔開。班級支援「501」或「1」格式。</p>
            <textarea id="studentData" class="w-full border p-2 rounded h-40 font-mono text-sm" oninput="renderNotices()" placeholder="5 501 12 王小明&#10;5 1 13 李小華">5 501 12 王小明
5 1 13 李小華</textarea>
        </div>

        <button onclick="window.print()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">
            🖨️ 準備列印 (或另存 PDF)
        </button>
    </div>

    <div class="w-full md:w-2/3 p-8 bg-gray-200 overflow-y-auto h-screen">
        <h2 class="text-lg font-bold mb-4 text-gray-600">預覽區 (列印時僅顯示此處)</h2>
        <div id="previewArea" class="flex flex-col gap-6 items-center">
            </div>
    </div>
</div>

<script>
    function parseClass(grade, classRaw) {
        // 智慧辨識邏輯：
        // 如果班級數字大於 100 (例如 501)，且第一位數字等於年級，則取後兩位。
        let classStr = classRaw.toString();
        if (classStr.length >= 3 && classStr.startsWith(grade)) {
            return parseInt(classStr.substring(1)); // 501 -> 1
        }
        return classRaw; // 否則直接返回 (例如 1)
    }

    function renderNotices() {
        const title = document.getElementById('noticeTitle').value;
        const content = document.getElementById('noticeContent').value.replace(/\n/g, '<br>');
        const rawData = document.getElementById('studentData').value.trim();
        const template = document.getElementById('templateSelect').value;
        const previewArea = document.getElementById('previewArea');
        
        previewArea.innerHTML = '';

        if (!rawData) return;

        const lines = rawData.split('\n');
        
        lines.forEach(line => {
            const parts = line.split(/\s+/);
            if (parts.length < 4) return;

            const [grade, rawClass, seat, name] = parts;
            const finalClass = parseClass(grade, rawClass);

            const card = document.createElement('div');
            card.className = `preview-card bg-white p-8 shadow-md notice-card page-break ${getTemplateClass(template)}`;
            
            card.innerHTML = `
                <div class="text-center mb-6">
                    <h1 class="text-3xl font-black">${title}</h1>
                </div>
                <div class="flex justify-between border-b-2 border-gray-800 pb-2 mb-6">
                    <span>${grade} 年級</span>
                    <span>${finalClass} 班</span>
                    <span>座號：${seat}</span>
                    <span class="font-bold">姓名：${name}</span>
                </div>
                <div class="text-lg leading-relaxed mb-12 h-48">
                    ${content}
                </div>
                <div class="flex justify-end gap-12 mt-8">
                    <div class="text-center">
                        <p class="mb-8">導師簽章</p>
                        <div class="w-32 border-b border-black"></div>
                    </div>
                    <div class="text-center">
                        <p class="mb-8">家長簽章</p>
                        <div class="w-32 border-b border-black"></div>
                    </div>
                </div>
                <div class="mt-8 text-right text-sm text-gray-400">
                    列印日期：${new Date().toLocaleDateString()}
                </div>
            `;
            previewArea.appendChild(card);
        });
    }

    function getTemplateClass(template) {
        switch(template) {
            case 'formal': return 'border-double border-4 border-gray-800 font-serif';
            case 'playful': return 'rounded-3xl border-4 border-yellow-400 bg-yellow-50';
            default: return 'border border-gray-200';
        }
    }

    // 初始渲染
    renderNotices();
</script>

</body>
</html>
