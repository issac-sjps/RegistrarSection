<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>教務處簽名通知單產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        
        /* 模擬圖片中的空心字/藝術字效果 */
        .wordart-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: black;
            -webkit-text-stroke: 1px black;
            text-shadow: 2px 2px 0px #ccc;
            letter-spacing: 2px;
        }

        .notice-box {
            width: 100%;
            height: 14cm; /* 調整高度以符合一頁印幾份 */
            border: 1px solid black;
            padding: 20px;
            position: relative;
            background: white;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .print-container { 
                display: grid !important; 
                grid-template-columns: 1fr 1fr; /* 一頁兩欄 */
                gap: 0;
            }
            .notice-box { 
                border: 0.5px solid #000; 
                height: 14.8cm; /* A4 一半的高度 */
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="p-4">

<div class="max-w-5xl mx-auto no-print bg-white p-6 rounded-xl shadow-lg mb-8">
    <h1 class="text-2xl font-bold mb-4 text-blue-800">🖨️ 教務處通知單自動化系統</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-4">
            <div>
                <label class="block font-bold mb-1">1. 上傳 Excel 檔案</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm border border-gray-300 rounded-lg cursor-pointer bg-gray-50 p-2">
                <p class="text-xs text-gray-500 mt-1">欄位請包含：年級、班級、座號、姓名</p>
            </div>
            <div>
                <label class="block font-bold mb-1">2. 自訂通知單內容</label>
                <input id="customTitle" type="text" value="教務處簽名通知單" class="w-full border p-2 rounded mb-2 font-bold">
                <textarea id="customDesc" class="w-full border p-2 rounded h-24 text-sm">教務處有相關申請資料需要學生本人簽名，請學生拿本通知單到教務處簽名。</textarea>
            </div>
        </div>
        
        <div class="bg-blue-50 p-4 rounded-lg">
            <h3 class="font-bold mb-2 text-blue-700">智慧辨識說明</h3>
            <ul class="text-sm space-y-2 text-gray-700">
                <li>✅ <strong>班級自動修正：</strong> 如果年級是 5，班級寫 501，系統會自動轉換為 「5年 1班」。</li>
                <li>✅ <strong>自動排版：</strong> 預設為 A4 一頁兩份（左右併排）。</li>
                <li>✅ <strong>列印優化：</strong> 按下下方按鈕後，會自動隱藏設定區。</li>
            </ul>
            <button onclick="window.print()" class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">產生並列印通知單</button>
        </div>
    </div>
</div>

<div id="printArea" class="print-container grid grid-cols-1 md:grid-cols-2 w-full max-w-[210mm] mx-auto">
    <div class="p-10 text-center text-gray-400 no-print">請先上傳 Excel 檔案...</div>
</div>

<script>
    const fileInput = document.getElementById('excelFile');
    const printArea = document.getElementById('printArea');

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();

        reader.onload = (evt) => {
            const data = evt.target.result;
            const workbook = XLSX.read(data, { type: 'binary' });
            const sheetName = workbook.SheetNames[0];
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
            
            renderNotices(rows);
        };
        reader.readAsBinaryString(file);
    });

    function smartParseClass(grade, cls) {
        let gStr = grade.toString();
        let cStr = cls.toString();
        // 如果班級是 501 且 年級是 5，則去掉開頭的 5
        if (cStr.length >= 3 && cStr.startsWith(gStr)) {
            return parseInt(cStr.substring(gStr.length));
        }
        return cls;
    }

    function renderNotices(data) {
        const title = document.getElementById('customTitle').value;
        const desc = document.getElementById('customDesc').value;
        const today = new Date().toLocaleDateString();

        printArea.innerHTML = data.map(student => {
            // 自動對應 Excel 欄位名稱 (支援多種常見命名)
            const grade = student['年級'] || '';
            const rawClass = student['班級'] || '';
            const seat = student['座號'] || '';
            const name = student['姓名'] || '';
            
            const finalClass = smartParseClass(grade, rawClass);

            return `
                <div class="notice-box">
                    <div class="text-center mb-6">
                        <h1 class="wordart-title">${title}</h1>
                    </div>
                    
                    <div class="text-xl space-y-3 mb-6">
                        <p>班級：${grade} 年 ${finalClass} 班</p>
                        <p>座號：${seat}</p>
                        <p>姓名：${name}</p>
                    </div>

                    <div class="text-lg leading-relaxed mb-6">
                        <p class="font-bold">簽名時間：<span class="font-normal text-base">收到通知單後的下課或放學時間。</span></p>
                        <p class="font-bold">說明：<span class="font-normal text-base">${desc}</span></p>
                    </div>

                    <div class="absolute bottom-10 left-0 right-0 text-center">
                        <p class="text-xl">發放日期：<span class="border-b border-black inline-block w-48 text-center">${today}</span></p>
                    </div>
                </div>
            `;
        }).join('');
    }

    // 監聽文字變更同步更新 (若已有資料)
    document.getElementById('customTitle').oninput = () => { if(fileInput.files.length) fileInput.dispatchEvent(new Event('change')); };
    document.getElementById('customDesc').oninput = () => { if(fileInput.files.length) fileInput.dispatchEvent(new Event('change')); };
</script>

</body>
</html>
