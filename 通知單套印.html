<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧通知單產生器 V5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }

        /* A4 列印設定 */
        .page {
            width: 210mm;
            min-height: 296mm;
            margin: 10mm auto;
            background: white;
            display: grid;
            page-break-after: always;
            border: 1px solid #eee;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .notice-item {
            border: 0.5px solid #000;
            box-sizing: border-box;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* 改為靠上對齊 */
            gap: 10px;
        }

        /* 標題改為一般大粗體 */
        .main-title {
            font-size: 2rem; /* 大字 */
            font-weight: 900; /* 極粗 */
            text-align: center;
            line-height: 1.2;
            color: black;
            margin-bottom: 5px;
        }

        /* 簽章表格 */
        .sig-table { width: 100%; border-collapse: collapse; margin-top: auto; }
        .sig-table td { border: 1px solid black; padding: 6px; height: 40px; font-size: 1rem; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; }
            .page { border: none; box-shadow: none; margin: 0; width: 210mm; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="no-print p-6 bg-white border-b shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-wrap gap-8 items-start">
            
            <div class="flex-1 min-w-[250px] space-y-4">
                <h3 class="font-bold text-blue-700 border-l-4 border-blue-700 pl-2">1. 資料與版型</h3>
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="w-full text-sm border p-2 rounded">
                <select id="templateType" class="w-full p-2 border rounded font-bold bg-blue-50" onchange="processData()">
                    <option value="award">版型 B：領獎獎學金 (含簽章表)</option>
                    <option value="signature">版型 A：簡單通知單 (純文字)</option>
                </select>
            </div>

            <div class="flex-1 min-w-[200px] space-y-4">
                <h3 class="font-bold text-purple-700 border-l-4 border-purple-700 pl-2">2. 排版設定</h3>
                <div class="flex items-center gap-3">
                    <div class="text-center">
                        <span class="block text-xs text-gray-500">每列</span>
                        <input type="number" id="gridCols" value="2" min="1" class="w-16 p-2 border rounded text-center font-bold">
                    </div>
                    <span class="pt-4">✕</span>
                    <div class="text-center">
                        <span class="block text-xs text-gray-500">每頁</span>
                        <input type="number" id="gridRows" value="4" min="1" class="w-16 p-2 border rounded text-center font-bold">
                    </div>
                </div>
                <div class="text-xs">
                    整體字體大小: <input type="range" id="fontSizeBase" min="12" max="28" value="16" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer mt-2" oninput="processData()">
                </div>
            </div>

            <div class="flex-[2] min-w-[300px] space-y-3">
                <h3 class="font-bold text-orange-700 border-l-4 border-orange-700 pl-2">3. 自訂文字</h3>
                <input id="customTitle" type="text" placeholder="輸入大標題" value="教務處領獎通知" class="w-full border-2 border-orange-200 p-2 rounded-md font-bold text-lg">
                <textarea id="customContent" class="w-full border-2 border-orange-200 p-2 h-24 text-base rounded-md" placeholder="輸入說明內文...">時間：12/25(五) 第二節大下課
地點：教務處註冊組
說明：請攜帶本通知單與聯絡簿前來領取。</textarea>
            </div>

            <div class="flex flex-col gap-3 pt-8">
                <button onclick="processData()" class="bg-green-600 text-white py-3 px-8 rounded-full font-bold shadow-lg hover:bg-green-700 transition-all active:scale-95">🔄 產生預覽</button>
                <button onclick="window.print()" class="bg-blue-600 text-white py-3 px-8 rounded-full font-bold shadow-lg hover:bg-blue-700 transition-all active:scale-95">🖨️ 列印/轉PDF</button>
            </div>
        </div>
    </div>
</div>

<div id="printArea" class="py-4">
    <div class="text-center py-40 text-gray-400 no-print italic text-xl">
        👋 您好！請先上傳 Excel 檔案後點擊「產生預覽」。
    </div>
</div>

<script>
    let excelData = [];

    // 智慧班級辨識 (501 -> 1)
    function parseClass(grade, cls) {
        let g = grade?.toString() || "";
        let c = cls?.toString() || "";
        if (c.length >= 3 && c.startsWith(g)) {
            return parseInt(c.substring(g.length));
        }
        return c;
    }

    // 讀取 Excel
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            excelData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            alert("✅ 讀取完成！共有 " + excelData.length + " 位同學。");
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    // 核心渲染
    function processData() {
        if (excelData.length === 0) {
            alert("請先選擇 Excel 檔案！");
            return;
        }
        
        const type = document.getElementById('templateType').value;
        const title = document.getElementById('customTitle').value;
        const content = document.getElementById('customContent').value.replace(/\n/g, '<br>');
        const cols = parseInt(document.getElementById('gridCols').value);
        const rows = parseInt(document.getElementById('gridRows').value);
        const fSize = document.getElementById('fontSizeBase').value;
        const itemsPerPage = cols * rows;
        
        const printArea = document.getElementById('printArea');
        let html = '';
        
        for (let i = 0; i < excelData.length; i += itemsPerPage) {
            html += `<div class="page" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, 1fr); font-size: ${fSize}px;">`;
            
            const pageItems = excelData.slice(i, i + itemsPerPage);
            pageItems.forEach(student => {
                const g = student['年級'] || '';
                const rawC = student['班級'] || '';
                const s = student['座號'] || '';
                const name = student['姓名'] || '';
                const c = parseClass(g, rawC);
                const classCode = `${g}${c.toString().padStart(2,'0')}-${s}`;

                if (type === 'award') {
                    html += `
                    <div class="notice-item">
                        <div class="main-title" style="font-size: 1.5em;">${title}</div>
                        <div class="font-bold border-b border-gray-400 pb-1 mb-1">
                            領獎人：${classCode} ${name}
                            <span class="text-[0.6em] font-normal float-right text-gray-500">【簽領單】</span>
                        </div>
                        <div class="flex-grow py-1 leading-normal">
                            ${content}
                        </div>
                        <table class="sig-table">
                            <tr><td width="55%" class="bg-gray-50 text-center">事前家長簽章</td><td></td></tr>
                            <tr><td class="bg-gray-50 text-center">學生確認領取簽章</td><td></td></tr>
                        </table>
                    </div>`;
                } else {
                    html += `
                    <div class="notice-item">
                        <div class="main-title">${title}</div>
                        <div class="border-y-2 border-black py-3 my-2 font-bold text-center">
                            ${g} 年 ${c} 班 座號：${s} 姓名：${name}
                        </div>
                        <div class="flex-grow pt-2 leading-relaxed">
                            ${content}
                        </div>
                    </div>`;
                }
            });

            // 補空白格
            const emptySlots = itemsPerPage - pageItems.length;
            for(let j=0; j<emptySlots; j++) {
                html += `<div class="notice-item border-dashed border-gray-100"></div>`;
            }

            html += `</div>`;
        }
        printArea.innerHTML = html;
        window.scrollTo({ top: 400, behavior: 'smooth' });
    }
</script>

</body>
</html>
