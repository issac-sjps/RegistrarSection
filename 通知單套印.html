<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧通知單產生器 V4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }

        /* A4 列印設定 */
        .page {
            width: 210mm;
            min-height: 296mm;
            margin: 10mm auto;
            background: white;
            display: grid;
            page-break-after: always;
            border: 1px solid #eee; /* 畫面預覽用 */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .notice-item {
            border: 0.5px solid #000;
            box-sizing: border-box;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 簽章表格 */
        .sig-table { width: 100%; border-collapse: collapse; }
        .sig-table td { border: 1px solid black; padding: 4px; height: 35px; font-size: 0.9em; }

        /* 藝術字 */
        .art-title { font-weight: 900; -webkit-text-stroke: 1px black; color: white; text-shadow: 1.5px 1.5px 0 #000; text-align: center; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; }
            .page { border: none; box-shadow: none; margin: 0; width: 210mm; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="no-print p-6 bg-white border-b shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-wrap gap-6 items-start">
            
            <div class="flex-1 min-w-[250px] space-y-3">
                <h3 class="font-bold text-blue-700">1. 資料與版型</h3>
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="w-full text-sm border p-1 rounded">
                <select id="templateType" class="w-full p-2 border rounded font-medium bg-blue-50" onchange="processData()">
                    <option value="award">版型 B：領獎獎學金 (含簽章表)</option>
                    <option value="signature">版型 A：簡單通知單 (純文字)</option>
                </select>
            </div>

            <div class="flex-1 min-w-[250px] space-y-3">
                <h3 class="font-bold text-purple-700">2. 排版設定 (寬 x 高)</h3>
                <div class="flex items-center gap-2">
                    <input type="number" id="gridCols" value="2" min="1" class="w-12 p-1 border rounded text-center">
                    <span>x</span>
                    <input type="number" id="gridRows" value="4" min="1" class="w-12 p-1 border rounded text-center">
                    <span class="text-xs text-gray-500">(例如 2x4 共 8 份)</span>
                </div>
                <div class="text-xs">
                    字體大小: <input type="range" id="fontSizeBase" min="10" max="24" value="14" class="w-full" oninput="processData()">
                </div>
            </div>

            <div class="flex-[2] min-w-[300px] space-y-2">
                <h3 class="font-bold text-orange-700">3. 通知單內容</h3>
                <input id="customTitle" type="text" placeholder="輸入大標題" value="教務處領獎通知" class="w-full border p-1 rounded font-bold mb-1">
                <textarea id="customContent" class="w-full border p-2 h-20 text-sm" placeholder="輸入說明內文...">時間：12/25(五) 第二節大下課
地點：教務處註冊組
說明：請攜帶本通知單前來領取獎狀。</textarea>
            </div>

            <div class="space-y-2">
                <button onclick="processData()" class="w-full bg-green-600 text-white py-2 px-6 rounded font-bold hover:bg-green-700">🔄 產生預覽</button>
                <button onclick="window.print()" class="w-full bg-blue-600 text-white py-2 px-6 rounded font-bold hover:bg-blue-700">🖨️ 直接列印</button>
            </div>
        </div>
    </div>
</div>

<div id="printArea" class="py-4">
    <div class="text-center py-20 text-gray-400 no-print italic">
        請先上傳 Excel 並點擊「產生預覽」...
    </div>
</div>

<script>
    let excelData = [];

    // 智慧班級辨識
    function parseClass(grade, cls) {
        let g = grade?.toString() || "";
        let c = cls?.toString() || "";
        if (c.length >= 3 && c.startsWith(g)) {
            return parseInt(c.substring(g.length));
        }
        return c;
    }

    // 讀取 Excel
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            excelData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            alert("Excel 讀取成功！共 " + excelData.length + " 筆資料，請調整設定後點擊產生預覽。");
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    // 核心渲染邏輯
    function processData() {
        if (excelData.length === 0) {
            alert("請先上傳 Excel 檔案");
            return;
        }
        
        const type = document.getElementById('templateType').value;
        const title = document.getElementById('customTitle').value;
        const content = document.getElementById('customContent').value.replace(/\n/g, '<br>');
        const cols = parseInt(document.getElementById('gridCols').value);
        const rows = parseInt(document.getElementById('gridRows').value);
        const fSize = document.getElementById('fontSizeBase').value;
        const itemsPerPage = cols * rows;
        
        const printArea = document.getElementById('printArea');
        let html = '';
        
        // 依照筆數切割頁數
        for (let i = 0; i < excelData.length; i += itemsPerPage) {
            html += `<div class="page" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, 1fr); font-size: ${fSize}px;">`;
            
            const pageItems = excelData.slice(i, i + itemsPerPage);
            pageItems.forEach(student => {
                const g = student['年級'] || '';
                const rawC = student['班級'] || '';
                const s = student['座號'] || '';
                const name = student['姓名'] || '';
                const c = parseClass(g, rawC);
                const classCode = `${g}${c.toString().padStart(2,'0')}-${s}`;

                if (type === 'award') {
                    // 版型 B：領獎獎學金
                    html += `
                    <div class="notice-item">
                        <div class="font-bold border-b-2 border-black pb-1 mb-1">
                            領獎人：${classCode} ${name}
                            <span class="text-[0.6em] font-normal float-right">【教務處存查】</span>
                        </div>
                        <div class="flex-grow py-1 leading-snug text-[0.9em]">
                            <strong class="text-blue-900">${title}</strong><br>
                            ${content}
                        </div>
                        <table class="sig-table mt-1">
                            <tr><td width="60%" class="bg-gray-50 text-center text-[0.8em]">家長簽章</td><td></td></tr>
                            <tr><td class="bg-gray-50 text-center text-[0.8em]">學生領取確認</td><td></td></tr>
                        </table>
                    </div>`;
                } else {
                    // 版型 A：簡單通知單
                    html += `
                    <div class="notice-item">
                        <div class="art-title mb-2" style="font-size: 1.4em;">${title}</div>
                        <div class="border-y border-black py-2 my-1">
                            <p>班級：${g} 年 ${c} 班</p>
                            <p>座號：${s} 姓名：${name}</p>
                        </div>
                        <div class="flex-grow pt-2 leading-relaxed text-[0.95em]">
                            ${content}
                        </div>
                        <div class="text-[0.7em] text-right pt-2 border-t border-dotted">
                            發放日期：${new Date().toLocaleDateString()}
                        </div>
                    </div>`;
                }
            });

            // 補齊空格避免排版崩壞 (如果最後一頁沒滿)
            const emptySlots = itemsPerPage - pageItems.length;
            for(let j=0; j<emptySlots; j++) {
                html += `<div class="notice-item border-dashed border-gray-200"></div>`;
            }

            html += `</div>`;
        }
        printArea.innerHTML = html;
        
        // 自動捲動到預覽區
        window.scrollTo({ top: 300, behavior: 'smooth' });
    }
</script>

</body>
</html>
