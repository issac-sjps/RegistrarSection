<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧通知單產生器 V7 - 穩定排版版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #e2e8f0; }

        /* A4 容器 */
        @page { size: A4; margin: 0; }
        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 10mm; /* 外邊距 */
            margin: 10px auto;
            background: white;
            position: relative;
            page-break-after: always;
            box-sizing: border-box;
            display: block; /* 捨棄 Grid，改回區塊流 */
        }

        /* 單個通知單格子 */
        .notice-item {
            display: inline-block; /* 橫向排列 */
            vertical-align: top;
            border: 1px solid #000;
            box-sizing: border-box;
            padding: 10px;
            overflow: hidden;
            background: white;
            position: relative;
        }

        .main-title {
            font-size: 1.5rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 5px;
            color: #000;
        }

        .sig-table { width: 100%; border-collapse: collapse; margin-top: auto; }
        .sig-table td { border: 1px solid black; padding: 4px; height: 32px; font-size: 0.8rem; }
        .bg-label { background-color: #f3f4f6; text-align: center; font-weight: bold; width: 55%; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; }
            .page { margin: 0; border: none; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="no-print p-6 bg-white border-b-2 border-blue-500 sticky top-0 z-50 shadow-xl">
    <div class="max-w-7xl mx-auto flex flex-wrap gap-4 items-start">
        
        <div class="w-64 space-y-2">
            <h3 class="font-bold text-blue-800">1. 檔案上傳</h3>
            <input type="file" id="excelFile" accept=".xlsx, .xls" class="w-full text-xs border p-1 rounded">
            <select id="templateType" class="w-full p-2 border rounded font-bold bg-blue-50" onchange="switchTemplate()">
                <option value="award">教務處領獎學金 (含表格)</option>
                <option value="signature">教務處通知單 (純文字)</option>
            </select>
        </div>

        <div class="w-64 space-y-2">
            <h3 class="font-bold text-purple-800">2. 尺寸微調 (避開重疊)</h3>
            <div class="text-xs space-y-1">
                <label>格子高度 (mm): <input type="number" id="boxHeight" value="68" class="w-16 border rounded p-1" oninput="processData()"> </label><br>
                <label>格子寬度 (%): <input type="number" id="boxWidth" value="49" class="w-16 border rounded p-1" oninput="processData()"> </label><br>
                <label>上下間距 (mm): <input type="number" id="boxGap" value="2" class="w-16 border rounded p-1" oninput="processData()"> </label>
            </div>
        </div>

        <div class="flex-grow space-y-2">
            <h3 class="font-bold text-orange-800">3. 文字內容</h3>
            <input id="customTitle" type="text" class="w-full border p-1 rounded font-bold text-sm">
            <textarea id="customContent" class="w-full border p-1 h-16 text-xs"></textarea>
        </div>

        <div class="pt-6 space-y-2 text-right">
            <button onclick="processData()" class="bg-emerald-600 text-white py-2 px-6 rounded font-bold hover:bg-emerald-700 shadow-md">🔄 預覽/刷新</button>
            <button onclick="window.print()" class="bg-blue-600 text-white py-2 px-6 rounded font-bold hover:bg-blue-700 shadow-md">🖨️ 直接列印</button>
        </div>
    </div>
</div>

<div id="printArea" class="py-4"></div>

<script>
    let excelData = [];

    const defaultTexts = {
        award: {
            title: "教務處領獎學金",
            content: "時間：於明天9/17(三)第二節大下課。\n地點：教務處註冊組\n獎項：\n攜帶物品：聯絡簿、本通知單(應已貼於聯絡簿上)\n注意事項：\n1. 需有家長簽名才可以領獎學金。\n2. 請學生當場確認金額無誤後彌封訂於聯絡簿上帶回。\n3. 請家長當天確認學生是否有正確拿回獎學金給家長。學生簽領日期：__________"
        },
        signature: {
            title: "教務處通知單",
            content: "簽名時間：收到通知單後的下課或放學時間。\n說明：教務處有相關申請資料需要學生本人簽名，請學生拿本通知單到教務處簽名。"
        }
    };

    function switchTemplate() {
        const type = document.getElementById('templateType').value;
        document.getElementById('customTitle').value = defaultTexts[type].title;
        document.getElementById('customContent').value = defaultTexts[type].content;
        
        // 自動切換預設尺寸，避開重疊
        if (type === 'award') {
            document.getElementById('boxHeight').value = 68;
        } else {
            document.getElementById('boxHeight').value = 45;
        }
        processData();
    }

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            excelData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            alert("讀取成功！共 " + excelData.length + " 位學生");
            processData();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function parseClass(grade, cls) {
        let g = grade?.toString() || "";
        let c = cls?.toString() || "";
        if (c.length >= 3 && c.startsWith(g)) return parseInt(c.substring(g.length));
        return c;
    }

    function processData() {
        if (excelData.length === 0) return;
        
        const type = document.getElementById('templateType').value;
        const title = document.getElementById('customTitle').value;
        const content = document.getElementById('customContent').value.replace(/\n/g, '<br>');
        
        // 取得手動微調數值
        const boxH = document.getElementById('boxHeight').value;
        const boxW = document.getElementById('boxWidth').value;
        const boxGap = document.getElementById('boxGap').value;
        
        // 估計每頁可容納數量 (A4 扣掉上下邊距約 270mm)
        const itemsPerPage = Math.floor(270 / (parseFloat(boxH) + parseFloat(boxGap))) * 2;
        
        let html = '';
        for (let i = 0; i < excelData.length; i += itemsPerPage) {
            html += `<div class="page">`;
            const pageItems = excelData.slice(i, i + itemsPerPage);
            
            pageItems.forEach((student, index) => {
                const g = student['年級'] || '';
                const rawC = student['班級'] || '';
                const s = student['座號'] || '';
                const name = student['姓名'] || '';
                const c = parseClass(g, rawC);
                const classCode = `${g}${c.toString().padStart(2,'0')}-${s}`;

                // 設定每個格子的動態樣式
                const itemStyle = `
                    height: ${boxH}mm; 
                    width: ${boxW}%; 
                    margin-bottom: ${boxGap}mm; 
                    margin-right: ${index % 2 === 0 ? '1%' : '0'};
                `;

                if (type === 'award') {
                    html += `
                    <div class="notice-item" style="${itemStyle}">
                        <div class="main-title">${title}</div>
                        <div class="font-bold border-b border-black pb-1 mb-1 text-[0.85rem]">
                            領獎人：${classCode} ${name}
                            <span class="float-right font-normal text-gray-500 text-[0.6rem]">【貼於聯絡簿】</span>
                        </div>
                        <div class="flex-grow py-1 leading-tight text-[0.75rem] text-justify">${content}</div>
                        <table class="sig-table">
                            <tr><td class="bg-label">事前家長簽章</td><td></td></tr>
                            <tr><td class="bg-label">學生確認錢無誤後簽章</td><td></td></tr>
                            <tr><td class="bg-label">教務處發放完畢簽章</td><td></td></tr>
                        </table>
                    </div>`;
                } else {
                    html += `
                    <div class="notice-item" style="${itemStyle}">
                        <div class="main-title">${title}</div>
                        <div class="border-y border-black py-2 my-1 font-bold text-center text-[1rem]">
                            ${g} 年 ${c} 班 ${s} 號 ${name}
                        </div>
                        <div class="pt-1 leading-normal text-[0.9rem]">${content}</div>
                    </div>`;
                }
            });
            html += `</div>`;
        }
        document.getElementById('printArea').innerHTML = html;
    }

    // 初始化文字
    switchTemplate();
</script>

</body>
</html>
