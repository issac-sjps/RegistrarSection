<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114學年度簿本費補助申請單列印系統</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        /* 網頁介面樣式 (螢幕上看到的) */
        body {
            font-family: "標楷體", "DFKai-SB", sans-serif; /* 配合公文常用字體 */
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px;
        }

        .btn:hover {
            background-color: #34495e;
        }

        #file-input {
            margin-right: 10px;
        }

        /* 預覽區域 */
        #print-area {
            background: #525659; /* 模擬 PDF 檢視背景 */
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* A4 紙張樣式設定 */
        .page {
            background: white;
            width: 210mm; /* A4 寬度 */
            min-height: 297mm; /* A4 高度 */
            padding: 20mm;
            box-sizing: border-box;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            position: relative;
        }

        /* 表格樣式 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #f9f9f9;
        }
        
        /* 標題與說明文字 */
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 10px;
        }
        
        .header-info {
            text-align: right;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .instructions {
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 10px;
            text-align: justify;
        }

        .instructions ul, .instructions ol {
            padding-left: 20px;
            margin: 5px 0;
        }

        .footer {
            margin-top: 20px;
            font-size: 16px;
            text-align: right;
        }

        /* 重要：列印時的樣式設定 */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .control-panel {
                display: none; /* 隱藏控制面板 */
            }
            #print-area {
                background: white;
                padding: 0;
                display: block;
            }
            .page {
                box-shadow: none;
                margin: 0;
                width: 100%;
                height: auto;
                min-height: auto;
                page-break-after: always; /* 每一班強制換頁 */
            }
            /* 最後一頁不要多出空白頁 */
            .page:last-child {
                page-break-after: auto;
            }
        }
    </style>
</head>
<body>

    <div class="control-panel no-print">
        <h2>1. 選擇 Excel 檔案 -> 2. 預覽 -> 3. 列印</h2>
        <input type="file" id="file-input" accept=".xlsx, .xls" />
        <button class="btn" onclick="window.print()">列印所有班級申請單</button>
        <p style="color:red; font-size:12px;">*請確認 Excel 欄位包含：班級、姓名、性別、減免身分、簿本金額</p>
    </div>

    <div id="print-area">
        <div class="page" style="display:flex; justify-content:center; align-items:center; height: 297mm; color:#888;">
            請上傳 Excel 檔案以生成表單...
        </div>
    </div>

    <script>
        document.getElementById('file-input').addEventListener('change', handleFile, false);

        function handleFile(e) {
            const files = e.target.files;
            if (files.length == 0) return;
            
            const f = files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});

                // 準備存放所有資料的陣列
                let allStudents = [];

                // 讀取所有工作表 (一年級, 二年級...)
                workbook.SheetNames.forEach(sheetName => {
                    const worksheet = workbook.Sheets[sheetName];
                    // 將 Excel 轉為 JSON，預設第一列為標題
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    
                    // 簡單清理資料（過濾掉完全空的行）
                    const cleanData = json.filter(row => row['班級'] && row['姓名']);
                    allStudents = allStudents.concat(cleanData);
                });

                // 根據「班級」進行分組
                const classes = groupBy(allStudents, '班級');
                
                // 排序班級 (例如 101, 102...)
                const sortedClassNames = Object.keys(classes).sort();

                // 生成 HTML
                generateForms(sortedClassNames, classes);
            };

            reader.readAsArrayBuffer(f);
        }

        function groupBy(array, key) {
            return array.reduce((result, currentValue) => {
                (result[currentValue[key]] = result[currentValue[key]] || []).push(currentValue);
                return result;
            }, {});
        }

        function generateForms(classNames, dataMap) {
            const container = document.getElementById('print-area');
            container.innerHTML = ''; // 清空預覽區

            classNames.forEach(className => {
                const students = dataMap[className];
                
                // 創建每一頁的 HTML 結構
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                
                // 表格內容
                let tableRows = '';
                students.forEach(student => {
                    // 確保數值存在，若無則留空
                    const gender = student['性別'] || '';
                    const status = student['減免身分'] || '';
                    const amount = student['簿本金額'] || '';
                    
                    tableRows += `
                        <tr>
                            <td>${className}</td>
                            <td>${student['姓名']}</td>
                            <td>${gender}</td>
                            <td>${status}</td>
                            <td>${amount}</td>
                        </tr>
                    `;
                });

                // 補足空行 (讓表格看起來有一致的高度，方便老師手寫新增)
                for(let i=0; i < (15 - students.length); i++) {
                     tableRows += `
                        <tr>
                            <td>&nbsp;</td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                    `;
                }

                pageDiv.innerHTML = `
                    <h1>114學年度上學期簿本費補助班級申請單(${className})</h1>
                    
                    <div class="instructions">
                        <b>說明：</b>
                        <br>簿本費補助協助對象為中低收入戶及家庭突遭變故(經導師認定)致經濟陷入困境，無法順利就學，經認定需要幫助之學生。【本項申請以不重覆補助為原則，如已自行尋求社會資源補助者，請勿納入本次申請。】
                        <ol style="margin-top:5px; padding-left:24px;">
                            <li>本案簿本費僅限於【家庭聯絡簿、國語、數學、自然探索(生活探索)】有題目的簿本皆可，不含空白簿本，每生補助不得超過200元。</li>
                            <li>請填寫下表，導師簽名後請於9月05日(五)中午前交至註冊組(分機112) ，★若毋需提出申請，也請註明「無」，並簽名交回，感謝您的協助！</li>
                        </ol>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th width="10%">班級</th>
                                <th width="15%">學生姓名</th>
                                <th width="10%">性別</th>
                                <th width="45%" style="text-align:left;">
                                    簿本費減免身分<br>
                                    <span style="font-weight:normal; font-size:12px;">
                                    j中低收入戶 k家庭突遭變故(導師認定)<br>
                                    l 低收入戶學生申請學產基金，請勿納入本次申請。(低收入戶學生_不補助)
                                    </span>
                                </th>
                                <th width="20%">簿本費金額<br>(單位：元/每位學生)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>

                    <div class="footer">
                        導師簽名：_____________________ &nbsp;&nbsp;&nbsp;&nbsp; 日期：______年______月_______日
                    </div>
                `;

                container.appendChild(pageDiv);
            });
        }
    </script>
</body>
</html>
