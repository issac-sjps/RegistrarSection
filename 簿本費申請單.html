<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簿本費補助申請單產生器</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        /* --- 全域設定 --- */
        body {
            font-family: "標楷體", "DFKai-SB", "Taipei Sans TC", sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        /* --- 分頁標籤樣式 --- */
        .tabs {
            display: flex;
            justify-content: center;
            max-width: 900px;
            margin: 0 auto;
            margin-bottom: -1px;
        }

        .tab-btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #e0e0e0;
            border: 1px solid #ccc;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            margin: 0 5px;
            color: #555;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: #0056b3;
            border-top: 3px solid #0056b3;
            padding-bottom: 15px;
            z-index: 10;
        }

        /* --- 主要內容區塊 --- */
        .main-container {
            background: white;
            max-width: 900px;
            margin: 0 auto 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #ccc;
            position: relative;
            z-index: 5;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- 設定頁面樣式 --- */
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }
        textarea.form-control {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }
        
        .row {
            display: flex;
            gap: 20px;
        }
        .col {
            flex: 1;
        }

        /* --- 班級數設定區塊 --- */
        .class-config-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3欄 */
            gap: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .class-input-group {
            display: flex;
            align-items: center;
        }
        .class-input-group label {
            width: 80px;
            font-weight: bold;
        }
        .class-input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            color: #0056b3;
        }

        /* --- 預覽與上傳頁面樣式 --- */
        .upload-section {
            text-align: center;
            padding: 40px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            background: #fafafa;
        }
        
        .btn-print {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-print:hover { background-color: #004494; }

        /* --- 預覽區 (模擬A4) --- */
        #print-preview-container {
            background: #525659;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 500px;
            margin-top: 20px;
            border-radius: 8px;
        }

        /* --- A4 紙張樣式 (螢幕預覽用) --- */
        .page {
            background: white;
            width: 210mm;
            min-height: 297mm; /* 螢幕上維持 A4 高度感 */
            padding: 10mm; 
            box-sizing: border-box;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            position: relative;
        }

        /* --- 表格樣式 --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            border: 1px solid black;
            padding: 4px;
            text-align: center;
            font-size: 16px;
            vertical-align: middle;
        }
        th {
            background-color: #f0f0f0;
            font-weight: bold;
            padding: 8px 4px;
            line-height: 1.3;
        }
        td { height: 38px; }
        
        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: bold;
            line-height: 1.4;
        }
        
        .instructions {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 10px;
            text-align: justify;
        }
        .instructions ol {
            padding-left: 28px;
            margin: 5px 0;
        }

        .footer {
            margin-top: 20px;
            font-size: 18px;
            text-align: right;
            font-weight: bold;
        }

        /* --- 列印專用設定 (修正空白頁問題) --- */
        @media print {
            @page {
                size: A4;
                margin: 5mm; /* 邊界 0.5cm */
            }
            
            body { 
                background: white; 
                padding: 0; 
                margin: 0;
            }
            
            .tabs, .main-container { 
                display: none; /* 隱藏非表單元素 */
            }
            
            #print-preview-container {
                background: white;
                padding: 0;
                display: block;
                margin: 0;
            }
            
            .page {
                box-shadow: none;
                margin: 0;
                /* 關鍵修正：列印時高度設為 auto，避免跟 @page margin 衝突導致溢出 */
                width: 100%;
                min-height: 0; 
                height: auto; 
                padding: 0; 
                border: none;
                page-break-after: always; /* 每一班結束強制換頁 */
            }
            
            /* 避免最後一頁印完後又多吐一張白紙 */
            .page:last-child { 
                page-break-after: auto; 
            }
            
            th { 
                background-color: #f0f0f0 !important; 
                -webkit-print-color-adjust: exact; 
            }
        }
    </style>
</head>
<body>

    <div class="tabs no-print">
        <div class="tab-btn active" onclick="switchTab('settings')">⚙️ 參數設定</div>
        <div class="tab-btn" onclick="switchTab('preview')">🖨️ 上傳與列印</div>
    </div>

    <div class="main-container no-print">
        
        <div id="tab-settings" class="tab-content active">
            <h2 style="margin-top:0; border-bottom:2px solid #eee; padding-bottom:10px;">表單內容設定</h2>
            
            <div class="row">
                <div class="col">
                    <label class="form-label">學年度</label>
                    <input type="number" id="input-year" class="form-control" value="114">
                </div>
                <div class="col">
                    <label class="form-label">學期</label>
                    <select id="input-semester" class="form-control">
                        <option value="下學期" selected>下學期</option>
                        <option value="上學期">上學期</option>
                    </select>
                </div>
                <div class="col">
                    <label class="form-label">標題後綴</label>
                    <input type="text" id="input-title-suffix" class="form-control" value="簿本費補助班級申請單">
                </div>
            </div>

            <div class="form-group" style="margin-top:20px;">
                <label class="form-label">各年級班級數設定 (已預設)</label>
                <div class="class-config-grid">
                    <div class="class-input-group">
                        <label>一年級：</label>
                        <input type="number" id="class-cnt-1" min="0" value="6" onchange="refreshPreview()">
                    </div>
                    <div class="class-input-group">
                        <label>二年級：</label>
                        <input type="number" id="class-cnt-2" min="0" value="6" onchange="refreshPreview()">
                    </div>
                    <div class="class-input-group">
                        <label>三年級：</label>
                        <input type="number" id="class-cnt-3" min="0" value="7" onchange="refreshPreview()">
                    </div>
                    <div class="class-input-group">
                        <label>四年級：</label>
                        <input type="number" id="class-cnt-4" min="0" value="9" onchange="refreshPreview()">
                    </div>
                    <div class="class-input-group">
                        <label>五年級：</label>
                        <input type="number" id="class-cnt-5" min="0" value="8" onchange="refreshPreview()">
                    </div>
                    <div class="class-input-group">
                        <label>六年級：</label>
                        <input type="number" id="class-cnt-6" min="0" value="8" onchange="refreshPreview()">
                    </div>
                </div>
                <div style="font-size:13px; color:#666; margin-top:5px;">💡 系統將合併「設定的班級」與「Excel 讀取到的班級」，若無資料則印出空白表。</div>
            </div>

            <div class="form-group" style="margin-top:20px;">
                <label class="form-label">說明文字 (前言)</label>
                <textarea id="text-intro" class="form-control">簿本費補助協助對象為中低收入戶及家庭突遭變故(經導師認定)致經濟陷入困境，無法順利就學，經認定需要幫助之學生。【本項申請以不重覆補助為原則，如已自行尋求社會資源補助者，請勿納入本次申請。】</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">說明事項 1 (補助範圍)</label>
                <textarea id="text-point1" class="form-control">本案簿本費僅限於【家庭聯絡簿、國語、數學、自然探索(生活探索)】有題目的簿本皆可，不含空白簿本，每生補助不得超過200元。</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">說明事項 2 (繳回日期與地點) <span style="color:red; font-size:14px;">*已預設換行</span></label>
                <textarea id="text-point2" class="form-control">請填寫下表，導師簽名後請於【2月26日(四)】中午前交至註冊組(分機112) ，<br>★若毋需提出申請，也請註明「不申請」，並簽名交回，感謝您的協助！</textarea>
            </div>

            <div style="text-align:center; margin-top:30px;">
                <button class="btn-print" style="padding:10px 30px; font-size:16px; background:#28a745;" onclick="switchTab('preview')">設定完成，前往上傳 ➔</button>
            </div>
        </div>

        <div id="tab-preview" class="tab-content">
            <div class="upload-section">
                <h3 style="margin-top:0;">步驟：上傳 Excel 檔案</h3>
                <input type="file" id="file-input" accept=".xlsx, .xls" style="font-size:16px; padding:10px;">
                <p style="color:#666; font-size:14px; margin-top:10px;">
                    * 系統將自動合併「班級數設定」與「Excel 資料」。<br>
                    * Excel 欄位：班級, 姓名, 性別, 減免身分, 簿本金額<br>
                    * <strong>列印設定：邊界已設為 0.5cm (5mm)，已修正空白頁問題。</strong>
                </p>
                
                <button class="btn-print" onclick="window.print()">🖨️ 列印所有班級申請單</button>
            </div>
        </div>
    </div>

    <div id="print-preview-container">
        <div class="page" style="display:flex; justify-content:center; align-items:center; height: 297mm; color:#888; font-size: 24px; text-align:center;">
            資料讀取中...
        </div>
    </div>

    <script>
        // 全域變數
        let globalDataMap = {}; // 存放 Excel 資料
        let hasExcelLoaded = false; // 標記是否已讀取 Excel

        // 監聽
        document.getElementById('file-input').addEventListener('change', handleFile, false);
        
        const settingInputs = ['input-year', 'input-semester', 'input-title-suffix', 'text-intro', 'text-point1', 'text-point2'];
        settingInputs.forEach(id => {
            document.getElementById(id).addEventListener('input', refreshPreview);
        });

        // 初始化：直接產生預設的空白表單
        window.addEventListener('DOMContentLoaded', () => {
            refreshPreview();
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if(tabName === 'settings') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-settings').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-preview').classList.add('active');
            }
        }

        function handleFile(e) {
            const files = e.target.files;
            if (files.length == 0) return;
            
            const f = files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});

                let allStudents = [];

                workbook.SheetNames.forEach(sheetName => {
                    const worksheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    const cleanData = json.filter(row => row['班級']); 
                    allStudents = allStudents.concat(cleanData);
                });

                globalDataMap = groupBy(allStudents, '班級');
                hasExcelLoaded = true;

                generateForms();
            };

            reader.readAsArrayBuffer(f);
        }

        function refreshPreview() {
            generateForms();
        }

        function groupBy(array, key) {
            return array.reduce((result, currentValue) => {
                if (currentValue[key]) {
                    let k = String(currentValue[key]).trim();
                    (result[k] = result[k] || []).push(currentValue);
                }
                return result;
            }, {});
        }

        function getAllTargetClasses() {
            let classSet = new Set();

            if (hasExcelLoaded) {
                Object.keys(globalDataMap).forEach(k => classSet.add(k));
            }

            for (let grade = 1; grade <= 6; grade++) {
                let countInput = document.getElementById('class-cnt-' + grade);
                let count = parseInt(countInput.value) || 0;
                
                for (let c = 1; c <= count; c++) {
                    let classNumStr = c < 10 ? ('0' + c) : ('' + c);
                    let className = `${grade}${classNumStr}`;
                    classSet.add(className);
                }
            }

            return Array.from(classSet).sort();
        }

        function generateForms() {
            const container = document.getElementById('print-preview-container');
            container.innerHTML = ''; 

            const targetClasses = getAllTargetClasses();

            if (targetClasses.length === 0) {
                container.innerHTML = '<div class="page" style="display:flex; justify-content:center; align-items:center; height: 297mm; color:#888; font-size: 24px; text-align:center;">請設定班級數或上傳 Excel</div>';
                return;
            }

            const year = document.getElementById('input-year').value;
            const semester = document.getElementById('input-semester').value;
            const titleSuffix = document.getElementById('input-title-suffix').value;
            const introText = document.getElementById('text-intro').value;
            const point1Text = document.getElementById('text-point1').value;
            const point2Text = document.getElementById('text-point2').value;

            const prevSemester = (semester === '上學期') ? '下學期' : '上學期';

            targetClasses.forEach(className => {
                const students = globalDataMap[className] || [];
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                
                let tableRows = '';
                
                if (students.length === 0) {
                    // --- 空班級顯示 (已修改文字與換行) ---
                    tableRows += `
                        <tr>
                            <td>${className}</td>
                            <td></td>
                            <td></td>
                            <td style="color:red; font-size:15px; line-height:1.4;">上次無人申請<br>如無申請，請留空白。<br>底下簽名後繳回。</td>
                            <td></td>
                            <td></td>
                        </tr>
                    `;
                    const rowsToAdd = 9; 
                    for(let i=0; i < rowsToAdd; i++) {
                        tableRows += `
                            <tr>
                                <td>&nbsp;</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                        `;
                    }

                } else {
                    // 有資料顯示
                    students.forEach(student => {
                        const name = student['姓名'] || '';
                        const gender = student['性別'] || '';
                        let rawStatus = student['減免身分'] || '';
                        const lastAmount = student['簿本金額'] || ''; 

                        let displayStatus = rawStatus;
                        if (rawStatus.includes('中低')) {
                            displayStatus = '1.中低收';
                        } else if (rawStatus.includes('變故') || rawStatus.includes('導師') || rawStatus.includes('家庭')) {
                            displayStatus = '2.導師認定';
                        }
                        
                        tableRows += `
                            <tr>
                                <td>${className}</td>
                                <td>${name}</td>
                                <td>${gender}</td>
                                <td>${displayStatus}</td>
                                <td>${lastAmount}</td>
                                <td></td>
                            </tr>
                        `;
                    });

                    const minRows = 10;
                    const rowsToAdd = Math.max(0, minRows - students.length);
                    for(let i=0; i < rowsToAdd; i++) {
                        tableRows += `
                            <tr>
                                <td>&nbsp;</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                        `;
                    }
                }

                pageDiv.innerHTML = `
                    <h1>${year}學年度${semester}${titleSuffix}(${className})</h1>
                    
                    <div class="instructions">
                        <b>說明：</b>
                        ${introText}
                        <ol>
                            <li>${point1Text}</li>
                            <li>${point2Text}</li>
                        </ol>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th width="8%">班級</th>
                                <th width="12%">學生姓名</th>
                                <th width="6%">性別</th>
                                <th width="34%" style="text-align:left; font-size:15px; padding-left:10px;">
                                    簿本費減免身分<br>
                                    <span style="font-weight:normal; font-size:13px; line-height:1.4; display:block; margin-top:2px;">
                                    1.中低收入戶<br>
                                    2.家庭突遭變故(導師認定)<br>
                                    ☆低收入戶學生申請學產基金，請勿納入本次申請。
                                    </span>
                                </th>
                                <th width="18%">上次簿本費<br>申請金額<br><span style="font-size:14px;">(${prevSemester})</span></th>
                                <th width="22%" style="background-color:#fffbea;">本次簿本費<br>申請金額<br><span style="font-size:13px; font-weight:normal;">(請導師填寫金額)<br>(或改不申請)</span></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>

                    <div class="footer">
                        導師簽名：_____________________ &nbsp;&nbsp;&nbsp;&nbsp; 日期：______年______月_______日
                    </div>
                `;

                container.appendChild(pageDiv);
            });
        }
    </script>
</body>
</html>
