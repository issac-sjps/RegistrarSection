<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學評語產生器 - 專業版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #6c757d;
            --success: #28a745;
            --light: #f8f9fa;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: #e9ecef; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); }
        
        .setup-section { border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 20px; }
        .upload-area { display: flex; align-items: center; gap: 15px; background: var(--light); padding: 15px; border-radius: 8px; }
        
        .main-grid { display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
        
        /* 學生列表 */
        .student-list { border: 1px solid #ddd; border-radius: 8px; height: 500px; overflow-y: auto; background: #fff; }
        .student-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        .student-item:hover { background: #e3f2fd; }
        .student-item.active { background: var(--primary); color: white; }

        /* 標籤選擇區 */
        .tag-group { margin-bottom: 20px; }
        .tag-group h3 { font-size: 1rem; color: var(--primary); border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; cursor: pointer; background: #fdfdfd; border: 1px solid #eee; padding: 5px 10px; border-radius: 4px; }
        .checkbox-item:hover { border-color: var(--primary); }
        .checkbox-item input { cursor: pointer; }

        /* 字數控制 */
        .config-bar { display: flex; align-items: center; gap: 20px; margin: 20px 0; padding: 10px; background: #fffde7; border-radius: 8px; }

        /* 結果區 */
        .result-area { margin-top: 20px; }
        textarea { width: 100%; height: 120px; padding: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1.1rem; box-sizing: border-box; resize: none; }
        .btns { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 小學評語自動產生器 (專業版)</h1>

    <div class="setup-section">
        <div class="upload-area">
            <strong>第一步：匯入名單</strong>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
            <small style="color: #666;">(Excel 需包含「姓名」欄位)</small>
        </div>
    </div>

    <div class="main-grid">
        <div>
            <h3 style="margin-top:0">學生清單 (<span id="stuCount">0</span>)</h3>
            <div class="student-list" id="studentList">
                <div style="padding:20px; color:#999;">請先上傳 Excel 檔案</div>
            </div>
        </div>

        <div>
            <div class="config-bar">
                <strong>第二步：設定評語目標字數</strong>
                <label><input type="radio" name="wordCount" value="short" checked> 約 100 字</label>
                <label><input type="radio" name="wordCount" value="long"> 約 150-200 字</label>
            </div>

            <div id="tagContainer">
                </div>

            <div class="result-area">
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <strong>第三步：生成評語</strong>
                    <span id="charCount" style="font-size: 0.8rem; color: #666;">目前字數：0</span>
                </div>
                <textarea id="output" placeholder="勾選上方特質後，評語會自動顯示於此..."></textarea>
                <div class="btns">
                    <button class="btn-primary" onclick="generateComment()">手動刷新評語</button>
                    <button class="btn-success" onclick="copyContent()">複製評語</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let students = [];
    let currentStudent = "";

    // 評語資料庫
    const pool = {
        "學習態度": [
            { id: "l1", text: "上課專注度高，能積極參與討論", len: "long" },
            { id: "l2", text: "作業書寫工整，展現良好的求知欲", len: "short" },
            { id: "l3", text: "邏輯思考能力強，對於數學理解迅速", len: "long" },
            { id: "l4", text: "學習態度踏實，能按部就班完成任務", len: "short" },
            { id: "l5", text: "具備主動解決問題的能力，非常難得", len: "long" }
        ],
        "品行生活": [
            { id: "c1", text: "遵守紀律，是一位讓老師放心的孩子", len: "short" },
            { id: "c2", text: "做事負責盡職，擔任幹部盡心盡力", len: "long" },
            { id: "c3", text: "生活常規良好，懂得愛惜公物", len: "short" },
            { id: "c4", text: "個性穩重，處事細心且有條理", len: "long" },
            { id: "c5", text: "活潑開朗，能帶動班上的正面氣氛", len: "short" }
        ],
        "人際互動": [
            { id: "s1", text: "熱心助人，經常主動協助受困同學", len: "long" },
            { id: "s2", text: "待人誠懇有禮，與同儕相處和諧", len: "short" },
            { id: "s3", text: "具備團隊合作精神，在小組表現出色", len: "long" },
            { id: "s4", text: "懂得分享與體諒，人緣極佳", len: "short" }
        ],
        "建議期許": [
            { id: "f1", text: "若能再多一點自信，表現會更亮眼", len: "short" },
            { id: "f2", text: "期許下學期保持熱情，勇於挑戰自我", len: "long" },
            { id: "f3", text: "加油！老師相信你的潛力不止於此", len: "short" },
            { id: "f4", text: "希望你能學習時間分配，讓生活更規律", len: "long" }
        ]
    };

    // 初始化：生成多選格子
    function initTags() {
        const container = document.getElementById('tagContainer');
        for (const [category, items] of Object.entries(pool)) {
            const group = document.createElement('div');
            group.className = 'tag-group';
            group.innerHTML = `<h3>${category}</h3><div class="checkbox-grid"></div>`;
            const grid = group.querySelector('.checkbox-grid');
            
            items.forEach(item => {
                const label = document.createElement('label');
                label.className = 'checkbox-item';
                label.innerHTML = `<input type="checkbox" value="${item.text}" onchange="generateComment()"> ${item.text}`;
                grid.appendChild(label);
            });
            container.appendChild(group);
        }
    }

    // 處理 Excel 匯入
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(firstSheet);
            
            // 尋找「姓名」欄位
            students = json.map(row => row['姓名'] || row['Name'] || Object.values(row)[0]).filter(n => n);
            renderStudentList();
        };
        reader.readAsArrayBuffer(file);
    });

    function renderStudentList() {
        const list = document.getElementById('studentList');
        const count = document.getElementById('stuCount');
        list.innerHTML = "";
        count.innerText = students.length;
        
        students.forEach(name => {
            const div = document.createElement('div');
            div.className = 'student-item';
            div.innerText = name;
            div.onclick = function() {
                document.querySelectorAll('.student-item').forEach(i => i.classList.remove('active'));
                div.classList.add('active');
                currentStudent = name;
                generateComment();
            };
            list.appendChild(div);
        });
    }

    // 生成評語核心邏輯
    function generateComment() {
        if (!currentStudent) {
            document.getElementById('output').value = "請先從左側選取一位學生。";
            return;
        }

        const checkedBoxes = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'));
        const targetLen = document.querySelector('input[name="wordCount"]:checked').value;
        
        // 基礎語法
        let intro = `${currentStudent}同學本學期表現優異，`;
        let body = checkedBoxes.map(cb => cb.value).join('；');
        let conclusion = "。希望你在未來的學習道路上，能繼續保持這份熱誠，更上一層樓。";

        // 字數填充邏輯（若勾選太少但要求長字數，則自動補充修飾詞）
        if (targetLen === 'long') {
            intro = `${currentStudent}同學本學期在校生活充實且精彩，老師觀察到你在各方面都有顯著的進步。`;
            conclusion = "。期許你下學期能帶著這份正向的能量，勇敢面對新的挑戰，加油！";
        }

        let fullText = body ? intro + body + conclusion : intro + "（請勾選特質）" + conclusion;
        
        document.getElementById('output').value = fullText;
        document.getElementById('charCount').innerText = `目前字數：${fullText.length}`;
    }

    function copyContent() {
        const copyText = document.getElementById("output");
        copyText.select();
        document.execCommand("copy");
        alert("評語已複製！");
    }

    initTags();
</script>

</body>
</html>
