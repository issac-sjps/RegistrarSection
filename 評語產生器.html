<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學評語產生器 - 專業萬用版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2;
            --accent: #ff7675;
            --bg: #f4f7f6;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* 頂部設定區 */
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #e0e0e0; }
        .input-box { display: flex; flex-direction: column; gap: 8px; }
        input[type="text"], input[type="file"] { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        
        /* 主區域佈局 */
        .main-content { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
        
        /* 學生列表 */
        .student-sidebar { border: 1px solid #eee; border-radius: 8px; height: 600px; overflow-y: auto; background: #fff; }
        .stu-item { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .stu-item:hover { background: #e3f2fd; }
        .stu-item.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* 多選格子區 */
        .tag-section { margin-bottom: 25px; }
        .tag-title { font-size: 1.1rem; color: var(--primary); font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .tag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .tag-card { 
            display: flex; align-items: flex-start; gap: 8px; padding: 10px; 
            background: #fff; border: 1px solid #ddd; border-radius: 6px; 
            cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .tag-card:hover { border-color: var(--primary); background: #f0f7ff; }
        .tag-card input { margin-top: 3px; }
        .tag-card.checked { background: #e3f2fd; border-color: var(--primary); }

        /* 字數選擇器 */
        .word-count-selector { background: #fff3e0; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; }

        /* 結果區 */
        .result-box { position: sticky; bottom: 20px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); border: 2px solid var(--primary); }
        textarea { width: 100%; height: 120px; padding: 12px; border: none; font-size: 1.1rem; resize: none; outline: none; line-height: 1.6; color: #333; }
        .footer-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-copy { background: var(--primary); color: white; }
        .btn-clear { background: #eee; color: #666; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-top: 0;">🍎 小學評語產生器</h2>

    <div class="setup-grid">
        <div class="input-box">
            <label><strong>👤 模式 A：手動輸入學生姓名</strong></label>
            <input type="text" id="manualName" placeholder="請在此輸入姓名（會優先使用此欄位）" oninput="updateName()">
        </div>
        <div class="input-box">
            <label><strong>📁 模式 B：匯入 Excel 名單</strong></label>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
        </div>
    </div>

    <div class="main-content">
        <div class="student-sidebar">
            <div style="padding:15px; font-weight:bold; background:#eee;">學生清單 (<span id="count">0</span>)</div>
            <div id="stuList">
                <div style="padding:20px; color:#999; font-size: 0.9rem;">尚未匯入名單</div>
            </div>
        </div>

        <div>
            <div class="word-count-selector">
                <strong>📝 評語目標長度：</strong>
                <label><input type="radio" name="wLen" value="100" checked onchange="refresh()"> 100 字左右 (簡潔)</label>
                <label><input type="radio" name="wLen" value="150" onchange="refresh()"> 150-200 字 (豐富)</label>
                <label><input type="radio" name="wLen" value="250" onchange="refresh()"> 250 字以上 (詳盡)</label>
            </div>

            <div id="tagGroups">
                </div>
        </div>
    </div>

    <div class="result-box">
        <textarea id="outputText" placeholder="選取學生並勾選特質後，評語會自動產生於此..."></textarea>
        <div class="footer-btns">
            <span id="charCount" style="color:#888;">目前字數：0</span>
            <div>
                <button class="btn btn-clear" onclick="resetAll()">清空重置</button>
                <button class="btn btn-copy" onclick="copyContent()">一鍵複製評語</button>
            </div>
        </div>
    </div>
</div>

<script>
    let students = [];
    let selectedName = "";

    const database = {
        "📖 學習表現": [
            "上課聽講專注，能積極思考並舉手發言",
            "作業書寫極為工整，學習態度堪為模範",
            "邏輯分析能力優異，尤其在數學領域表現突出",
            "理解力強，能迅速掌握老師教授的新知識",
            "面對學業挑戰不輕言放棄，展現良好韌性",
            "具備主動學習的精神，常能自發鑽研課外知識",
            "課堂討論時能提出獨到見解，令人印象深刻"
        ],
        "🌱 品行生活": [
            "個性沈穩負責，老師交辦的事務皆能圓滿達成",
            "品德優良，待人接物誠懇有禮，深得師長喜愛",
            "生活習慣良好，擔任班級幹部盡職認真",
            "做事細心且有條理，能把自己的環境整理得井然有序",
            "處事公正無私，是老師在班級經營上的好幫手",
            "性格活潑開朗，總是帶著燦爛笑容，是班上的開心果",
            "非常有自律心，即便老師不在場也能自發維持秩序"
        ],
        "🤝 人際互動": [
            "熱心助人，當同學遇到困難時總能主動伸出援手",
            "具備卓越的領導才能，能帶領團隊共同完成任務",
            "心胸開闊，懂得包容他人，同儕關係極為融洽",
            "樂於分享學習心得，在團體合作中扮演關鍵角色",
            "溝通能力佳，能理性處理與同學間的摩擦",
            "待人真誠，深受同學信任，擁有極佳的人緣",
            "懂得體諒他人，說話得體，展現良好的社交禮儀"
        ],
        "✨ 鼓勵與建議": [
            "期許下學期能保持這份熱忱，繼續在學業上突破自我",
            "若能在處理細節時更加細心，表現定能更趨完美",
            "加油！老師對你充滿信心，相信你的潛力無可限量",
            "希望你能多參與群體活動，展現你內在的才華",
            "期盼你能將這份專注力延伸至各個學科，全方位進步",
            "期待看到你更自信、更勇敢地表達自己的想法",
            "願你保持這顆好奇心，勇敢地探索未知的領域"
        ]
    };

    // 初始化標籤
    function init() {
        const container = document.getElementById('tagGroups');
        for (const [title, items] of Object.entries(database)) {
            const section = document.createElement('div');
            section.className = 'tag-section';
            section.innerHTML = `<div class="tag-title">${title}</div><div class="tag-grid"></div>`;
            const grid = section.querySelector('.tag-grid');
            
            items.forEach(item => {
                const card = document.createElement('label');
                card.className = 'tag-card';
                card.innerHTML = `<input type="checkbox" value="${item}" onchange="refresh()"> <span>${item}</span>`;
                grid.appendChild(card);
            });
            container.appendChild(section);
        }
    }

    // 處理 Excel
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const wb = XLSX.read(new Uint8Array(event.target.result), {type: 'array'});
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            students = data.map(r => r['姓名'] || Object.values(r)[0]).filter(n => n);
            renderList();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function renderList() {
        const list = document.getElementById('stuList');
        document.getElementById('count').innerText = students.length;
        list.innerHTML = "";
        students.forEach(name => {
            const div = document.createElement('div');
            div.className = 'stu-item';
            div.innerText = name;
            div.onclick = () => {
                document.querySelectorAll('.stu-item').forEach(i => i.classList.remove('active'));
                div.classList.add('active');
                document.getElementById('manualName').value = name;
                selectedName = name;
                refresh();
            };
            list.appendChild(div);
        });
    }

    function updateName() {
        selectedName = document.getElementById('manualName').value;
        refresh();
    }

    function refresh() {
        const name = selectedName || "該生";
        const tags = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(i => i.value);
        const len = document.querySelector('input[name="wLen"]:checked').value;
        
        let intro = `${name}同學：\n本學期你在校表現非常優異。`;
        let closing = "加油！老師對你充滿期待。";

        // 字數擴充邏輯
        if (len == "150") {
            intro = `${name}同學：\n時光荏苒，本學期已接近尾聲。觀察你這幾個月來的在校生活，老師感到非常欣慰。`;
            closing = "希望在未來的日子裡，你能繼續秉持這份正向的態度，勇敢追尋自己的夢想，老師會一直為你加油的！";
        } else if (len == "250") {
            intro = `${name}同學：\n轉眼間本學期即將結束，回顧你在校的點點滴滴，老師看見了你各方面的成長與進步。你是一位優秀的孩子，在班級中展現了獨特的個人特色。`;
            closing = "教育是一場長跑，期許你在接下來的學習旅程中，能保持這份難能可貴的好奇心與上進心，不斷挑戰自我的極限。老師相信你一定能譜寫出屬於自己精彩的篇章，加油！";
        }

        const body = tags.length > 0 ? tags.join('；') + '。' : "（請勾選特質選項）";
        const result = `${intro}\n${body}\n${closing}`;
        
        document.getElementById('outputText').value = result;
        document.getElementById('charCount').innerText = `目前字數：${result.length}`;
        
        // 切換卡片樣式
        document.querySelectorAll('.tag-card').forEach(card => {
            card.classList.toggle('checked', card.querySelector('input').checked);
        });
    }

    function resetAll() {
        document.querySelectorAll('input[type="checkbox"]').forEach(i => i.checked = false);
        document.getElementById('manualName').value = "";
        selectedName = "";
        refresh();
    }

    function copyContent() {
        const area = document.getElementById('outputText');
        area.select();
        document.execCommand('copy');
        alert('評語已複製到剪貼簿！');
    }

    init();
</script>

</body>
</html>
