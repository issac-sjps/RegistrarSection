<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊減免申請 - 請領清冊與經費統計</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .table-check { font-family: "MS Gothic", "SimSun", serif; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="card no-print">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">上傳原始 Excel 資料</h4>
        </div>
        <div class="card-body">
            <p class="text-muted">會自動排除「低收」名單，僅抓取「2.中低收(社)」與「12.導師認定(家庭變故)」，請領金額預設為 200 元。</p>
            <input type="file" id="uploadExcel" class="form-control" accept=".xlsx, .xls">
        </div>
    </div>

    <div id="resultArea"></div>
</div>

<script>
document.getElementById('uploadExcel').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        
        let summary = {}; 
        let htmlContent = "";
        let totalProcessed = 0;

        // 動態抓取所有工作表
        workbook.SheetNames.forEach(sheetName => {
            const worksheet = workbook.Sheets[sheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, {defval: ''});
            
            if (jsonData.length === 0) return;

            summary[sheetName] = { midLow: 0, emergency: 0 };
            let tableRows = "";
            let count = 0;

            jsonData.forEach((row) => {
                // 將所有 key 去除前後空白，避免欄位名稱有隱藏空白導致抓不到
                const cleanRow = {};
                for(let key in row) {
                    cleanRow[key.trim()] = row[key];
                }

                const familyStatus = judgeStatus(cleanRow);
                if (familyStatus.type === "") return; // 不符合資格者直接跳過

                count++;
                totalProcessed++;
                
                if (familyStatus.type === "midLow") summary[sheetName].midLow++;
                if (familyStatus.type === "emergency") summary[sheetName].emergency++;

                const isMidLow = familyStatus.type === 'midLow';
                const isEmergency = familyStatus.type === 'emergency';

                tableRows += `
                    <tr>
                        <td class="text-center">${count}</td>
                        <td>${cleanRow['姓名'] || ''}</td>
                        <td class="text-center">${cleanRow['班級'] || ''}</td>
                        <td class="text-center">${cleanRow['性別'] || ''}</td>
                        <td class="table-check">
                            □低收入戶
                            ${isMidLow ? '■' : '□'}中低收入戶
                            ${isEmergency ? '■' : '□'}家庭突遭變故
                        </td>
                        <td class="text-end">200</td>
                        <td></td>
                        <td></td>
                    </tr>`;
            });

            // 如果該工作表有符合的學生，才產生表格
            if(count > 0) {
                htmlContent += `
                <div class="card mt-4">
                    <div class="card-header bg-secondary text-white"><h5>${sheetName} 領取清冊</h5></div>
                    <div class="card-body">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light text-center">
                                <tr>
                                    <th width="50">編號</th>
                                    <th>學生姓名</th>
                                    <th>年級班級</th>
                                    <th>性別</th>
                                    <th>家庭情形</th>
                                    <th>請領金額</th>
                                    <th width="100">簽章</th>
                                    <th>備註</th>
                                </tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                    </div>
                </div>`;
            }
        });

        if (totalProcessed === 0) {
            htmlContent = `<div class="alert alert-warning mt-3">找不到符合條件的學生。請確認 Excel 欄位名稱是否正確包含「1.低收(社)」、「2.中低收(社)」或「12.導師認定」。</div>`;
        } else {
            // 產生統計表
            htmlContent += generateSummaryTable(summary);
        }

        document.getElementById('resultArea').innerHTML = htmlContent;
    };
    reader.readAsArrayBuffer(file);
});

// 判斷身分邏輯
function judgeStatus(row) {
    // 判斷欄位內是否有值 (過濾掉空白、0、false、否、n)
    const isChecked = (val) => {
        if (val === undefined || val === null || val === '') return false;
        const s = String(val).trim().toLowerCase();
        if (s === '0' || s === 'false' || s === '否' || s === 'n') return false;
        return true; 
    };

    // 1. 若為低收，直接排除不列印
    if (isChecked(row['1.低收(社)'])) {
        return { type: '' };
    }

    // 2. 判斷中低收 (只有 2.中低收(社) 打勾才算)
    if (isChecked(row['2.中低收(社)'])) {
        return { type: 'midLow' };
    }

    // 3. 判斷導師認定 (家庭變故)
    if (isChecked(row['12.導師認定'])) {
        return { type: 'emergency' };
    }

    // 都沒有則為空
    return { type: '' };
}

// 產生經費匯總表
function generateSummaryTable(summary) {
    let totalAll = 0;
    let rows = "";
    
    for (let sheetName in summary) {
        const s = summary[sheetName];
        if (s.midLow === 0 && s.emergency === 0) continue; 

        const gradeTotal = (s.midLow + s.emergency) * 200;
        totalAll += gradeTotal;

        rows += `
            <tr>
                <td rowspan="3" class="align-middle text-center">${sheetName}</td>
                <td>□低收入戶</td>
                <td class="text-center">0</td>
                <td class="text-center">200</td>
                <td class="text-end">0</td>
                <td rowspan="3" class="align-middle text-end fw-bold">${gradeTotal}</td>
            </tr>
            <tr>
                <td>■中低收入戶</td>
                <td class="text-center">${s.midLow}</td>
                <td class="text-center">200</td>
                <td class="text-end">${s.midLow * 200}</td>
            </tr>
            <tr>
                <td>□家庭突遭變故</td>
                <td class="text-center">${s.emergency}</td>
                <td class="text-center">200</td>
                <td class="text-end">${s.emergency * 200}</td>
            </tr>
        `;
    }

    return `
        <div class="card mt-5 border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">經費明細匯總表</h5>
            </div>
            <div class="card-body">
                <table class="table table-bordered">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>年段</th><th>家庭情形</th><th>申請學生人數</th><th>單價</th><th>小計</th><th>合計</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                        <tr class="table-warning fw-bold">
                            <td colspan="5" class="text-center">總計金額</td>
                            <td class="text-end">${totalAll} 元</td>
                        </tr>
                    </tbody>
                </table>
                <div class="text-end mt-3">
                    <button class="btn btn-success no-print" onclick="window.print()">列印報表</button>
                </div>
            </div>
        </div>`;
}
</script>

</body>
</html>
