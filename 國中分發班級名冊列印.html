<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>班級分發結果合併列印</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; background-color: #f4f7f6; }
        .no-print { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* 區塊容器：防止班級標題跟表格被切開 */
        .class-section { 
            page-break-inside: avoid; 
            margin-bottom: 40px; 
            background: white;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #000; padding: 6px; text-align: center; font-size: 13px; }
        th { background-color: #f2f2f2; }
        
        .class-title { 
            text-align: left; 
            font-size: 18px; 
            font-weight: bold; 
            border-left: 5px solid #333;
            padding-left: 10px;
            margin-top: 20px;
        }

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .class-section { page-break-inside: avoid; } /* 確保一個班級盡量不被切斷 */
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h2>班級分發清單 (連續列印版)</h2>
        <p>上傳 Excel 後，各班會緊接著排列，不會強制換頁。</p>
        <input type="file" id="upload" accept=".xlsx, .xls" />
        <button onclick="window.print()" style="padding: 5px 15px; cursor: pointer; margin-left: 10px;">點此列印 / 存為 PDF</button>
    </div>

    <div id="output"></div>

    <script>
        document.getElementById('upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                let jsonData = XLSX.utils.sheet_to_json(worksheet);

                // 排序：先排班級(數字)，再排座號
                jsonData.sort((a, b) => {
                    const classA = parseInt(a.班級) || 0;
                    const classB = parseInt(b.班級) || 0;
                    if (classA !== classB) return classA - classB;
                    return (parseInt(a.座號) || 0) - (parseInt(b.座號) || 0);
                });

                const groupedData = jsonData.reduce((acc, row) => {
                    (acc[row.班級] = acc[row.班級] || []).push(row);
                    return acc;
                }, {});

                renderTables(groupedData);
            };
            reader.readAsArrayBuffer(file);
        });

        function renderTables(groups) {
            const output = document.getElementById('output');
            output.innerHTML = '';

            Object.keys(groups).forEach((className) => {
                let html = `<div class="class-section">`;
                html += `<div class="class-title">${className} 班</div>`;
                html += `<table>
                    <thead>
                        <tr>
                            <th width="8%">座號</th>
                            <th width="12%">姓名</th>
                            <th width="8%">性別</th>
                            <th width="25%">分發學校名稱</th>
                            <th width="22%">原分發學校</th>
                            <th width="25%">改分發備註</th>
                        </tr>
                    </thead>
                    <tbody>`;
                
                groups[className].forEach(student => {
                    html += `
                        <tr>
                            <td>${student.座號 || ''}</td>
                            <td>${student.姓名 || ''}</td>
                            <td>${student.性別 || ''}</td>
                            <td>${student.分發學校名稱 || ''}</td>
                            <td>${student.原分發學校 || ''}</td>
                            <td>${student.改分發備註 || ''}</td>
                        </tr>`;
                });

                html += `</tbody></table></div>`;
                output.innerHTML += html;
            });
        }
    </script>
</body>
</html>
