<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生補助身分轉換表單</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: "微軟正黑體", sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls { margin-bottom: 20px; padding: 15px; background: #eef2f5; border-radius: 5px; }
        input[type="file"] { padding: 8px; margin-right: 10px; }
        button { padding: 10px 15px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #004494; }
        .btn-success { background-color: #28a745; margin-left: 10px;}
        .btn-success:hover { background-color: #218838; }
        
        .table-wrapper { overflow-x: auto; margin-top: 20px; }
        table { border-collapse: collapse; width: 100%; min-width: 1000px; font-size: 14px; text-align: center; }
        th, td { border: 1px solid #000; padding: 8px; }
        th { background-color: #ffff99; font-weight: bold; }
        /* 總計列的底色與強調 */
        .total-row { background-color: #ffffcc; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 學生補助身分與費用統計工具</h2>
    
    <div class="controls">
        <label>上傳原始 Excel 檔：</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <button onclick="processFile()">產生表格</button>
        <button class="btn-success" onclick="downloadExcel()" id="downloadBtn" style="display:none;">📥 下載新 Excel</button>
    </div>

    <div class="table-wrapper">
        <table id="resultTable" style="display:none;">
            <thead>
                <tr>
                    <th rowspan="3">項次</th>
                    <th rowspan="3">校名</th>
                    <th rowspan="3">導師姓名</th>
                    <th rowspan="3">學生姓名</th>
                    <th colspan="6">學生身分</th>
                    <th colspan="4">項目及金額</th>
                </tr>
                <tr>
                    <th colspan="2">低收入戶</th>
                    <th colspan="2">中低收入戶</th>
                    <th colspan="2">家庭突遭變故<br>(導師認定)</th>
                    <th rowspan="2">家長會費<br>(每學期最高<br>100元)</th>
                    <th rowspan="2">教科用書書籍費<br>(國中每學期最高<br>500元)</th>
                    <th rowspan="2">學生團體保險費<br>(233元)</th>
                    <th rowspan="2">小計</th>
                </tr>
                <tr>
                    <th>男</th>
                    <th>女</th>
                    <th>男</th>
                    <th>女</th>
                    <th>男</th>
                    <th>女</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    function processFile() {
        const fileInput = document.getElementById('excelFile');
        const file = fileInput.files[0];

        if (!file) {
            alert("請先選擇 Excel 檔案！");
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = ""; 
            let count = 1;

            // 建立變數來記錄所有欄位的總計
            let totalLowM = 0, totalLowF = 0;
            let totalMidM = 0, totalMidF = 0;
            let totalTeachM = 0, totalTeachF = 0;
            let totalParentFee = 0;
            let totalBookFee = 0;
            let totalInsuranceFee = 0;
            let totalAll = 0;

            workbook.SheetNames.forEach(sheetName => {
                const worksheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {defval: ""});

                jsonData.forEach(row => {
                    const name = row['姓名'] || row['學生姓名'] || "";
                    const gender = row['性別'] || "";
                    const bestStatus = row['最優補助身分'] || "";

                    if (!name) return; 

                    let isLowIncome = bestStatus.includes("1.低收") || bestStatus.includes("1. 低收");
                    let isMidLowIncome = bestStatus.includes("2.中低收") || bestStatus.includes("2. 中低收");
                    let isTeacherApprove = bestStatus.includes("12.導師認定") || bestStatus.includes("12. 導師認定");

                    if (!isLowIncome && !isMidLowIncome && !isTeacherApprove) {
                        return; 
                    }

                    // 初始化單筆資料
                    let lowM = "", lowF = "", midM = "", midF = "", teachM = "", teachF = "";
                    let parentFee = 0, bookFee = 0, insuranceFee = 0;

                    // 依照您的規則分配金額與計算人數
                    if (isLowIncome) {
                        parentFee = 100;
                        bookFee = 500;
                        insuranceFee = 0; // 低收保險費為 0
                        if (gender === "男") { lowM = 1; totalLowM++; }
                        if (gender === "女") { lowF = 1; totalLowF++; }
                    } else if (isMidLowIncome) {
                        parentFee = 100;
                        bookFee = 500;
                        insuranceFee = 233;
                        if (gender === "男") { midM = 1; totalMidM++; }
                        if (gender === "女") { midF = 1; totalMidF++; }
                    } else if (isTeacherApprove) {
                        parentFee = 100;
                        bookFee = 500;
                        insuranceFee = 233;
                        if (gender === "男") { teachM = 1; totalTeachM++; }
                        if (gender === "女") { teachF = 1; totalTeachF++; }
                    }

                    // 算出單人的小計
                    let subTotal = parentFee + bookFee + insuranceFee;
                    
                    // 累加到底部的總計變數中
                    totalParentFee += parentFee;
                    totalBookFee += bookFee;
                    totalInsuranceFee += insuranceFee;
                    totalAll += subTotal;

                    const tr = document.createElement('tr');
                    // 金額如果是 0 就不顯示 (留空)，版面會比較乾淨
                    tr.innerHTML = `
                        <td>${count++}</td>
                        <td></td> 
                        <td></td> 
                        <td>${name}</td>
                        <td>${lowM}</td>
                        <td>${lowF}</td>
                        <td>${midM}</td>
                        <td>${midF}</td>
                        <td>${teachM}</td>
                        <td>${teachF}</td>
                        <td>${parentFee || ""}</td>
                        <td>${bookFee || ""}</td>
                        <td>${insuranceFee || ""}</td>
                        <td>${subTotal}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            });

            // 資料跑完後，加上最底下的「總計」列
            if(count > 1) {
                const totalTr = document.createElement('tr');
                totalTr.className = "total-row";
                totalTr.innerHTML = `
                    <td colspan="4">總計</td>
                    <td>${totalLowM || ""}</td>
                    <td>${totalLowF || ""}</td>
                    <td>${totalMidM || ""}</td>
                    <td>${totalMidF || ""}</td>
                    <td>${totalTeachM || ""}</td>
                    <td>${totalTeachF || ""}</td>
                    <td>${totalParentFee}</td>
                    <td>${totalBookFee}</td>
                    <td>${totalInsuranceFee}</td>
                    <td>${totalAll}</td>
                `;
                tableBody.appendChild(totalTr);
            }

            document.getElementById('resultTable').style.display = "table";
            document.getElementById('downloadBtn').style.display = "inline-block";
            
            if(count === 1) {
                alert("沒有找到符合條件的學生喔！");
            }
        };

        reader.readAsArrayBuffer(file);
    }

    function downloadExcel() {
        const table = document.getElementById('resultTable');
        const wb = XLSX.utils.table_to_book(table, {sheet: "補助名冊"});
        XLSX.writeFile(wb, "學生補助名冊彙整.xlsx");
    }
</script>

</body>
</html>
